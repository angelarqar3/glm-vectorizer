<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GLM 120 C - Vectorizador & Diagnóstico</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { background: #111; color: #eee; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { 
      padding: 8px; 
      background: #1c1c1e; 
      display: flex; 
      gap: 6px; 
      flex-wrap: wrap; 
      border-bottom: 1px solid #333; 
    }
    
    button { 
      background: #007aff; 
      color: #fff; 
      border: none; 
      padding: 8px 10px; 
      border-radius: 6px; 
      font-weight: 600; 
      font-size: 0.75rem; 
      cursor: pointer; 
      touch-action: manipulation;
    }
    button.active { background: #34c759; }
    button:disabled { background: #2c2c2e; color: #666; }

    #telemetry { 
      display: flex; 
      justify-content: space-around; 
      background: #000; 
      padding: 6px 4px; 
      font-size: 0.75rem; 
      color: #30d158; 
      border-bottom: 1px solid #222; 
    }

    #canvas-box { 
      flex: 1; 
      position: relative; 
      background: #181818; 
    }
    
    canvas { 
      width: 100%; 
      height: 100%; 
      display: block; 
    }

    #log { 
      height: 160px; 
      overflow-y: auto; 
      background: #080808; 
      padding: 8px; 
      font-size: 0.7rem; 
      border-top: 2px solid #333; 
      color: #aaa;
      line-height: 1.4;
    }
    #log .entry { border-bottom: 1px solid #1a1a1a; padding: 2px 0; word-break: break-all; }
    #log .info { color: #5ac8fa; }
    #log .warn { color: #ffd60a; }
    #log .err  { color: #ff453a; font-weight: bold; }
    #log .ok   { color: #30d158; }
  </style>
</head>
<body>

<header>
  <button id="btnSensors">1. Activar Brújula</button>
  <button id="btnBLE">2. Conectar GLM</button>
  <button id="btnOrtho">ORTO: OFF</button>
  <button id="btnDxf" disabled>Exportar DXF</button>
  <button id="btnClear">Reset</button>
</header>

<div id="telemetry">
  <span>Rumbo: <b id="lblHeading">--</b>°</span>
  <span>Snap: <b id="lblSnapped">--</b>°</span>
  <span>Dist: <b id="lblDist">0.000</b> m</span>
  <span>Pts: <b id="lblPts">1</b></span>
</div>

<div id="canvas-box">
  <canvas id="stage"></canvas>
</div>

<div id="log"></div>

<script>
  // UUIDs conocidos de telémetros Bosch
  const CANDIDATE_SERVICES = [
    "00005301-0000-0041-4c53-53494e535452",
    "00000001-0000-1000-8000-00805f9b34fb",
    "00001801-0000-1000-8000-00805f9b34fb",
    "00001800-0000-1000-8000-00805f9b34fb"
  ];

  let currentHeading = 0;
  let orthoEnabled = false;
  let points = [{ x: 0, y: 0 }];

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const logDiv = document.getElementById("log");
  const lblHeading = document.getElementById("lblHeading");
  const lblSnapped = document.getElementById("lblSnapped");
  const lblDist = document.getElementById("lblDist");
  const lblPts = document.getElementById("lblPts");

  const btnSensors = document.getElementById("btnSensors");
  const btnBLE = document.getElementById("btnBLE");
  const btnOrtho = document.getElementById("btnOrtho");
  const btnDxf = document.getElementById("btnDxf");
  const btnClear = document.getElementById("btnClear");

  function log(msg, type = "info") {
    const d = document.createElement("div");
    d.className = `entry ${type}`;
    const time = new Date().toLocaleTimeString().split(" ")[0];
    d.textContent = `[${time}] ${msg}`;
    logDiv.appendChild(d);
    logDiv.scrollTop = logDiv.scrollHeight;
  }

  function logErrorDetails(err, stage) {
    log(`FALLA EN ETAPA: ${stage}`, "err");
    if (!err) {
      log("Error devuelto: null / undefined (típico rechazo interno del plugin de Bluefy o desconexión por timeout)", "err");
      return;
    }
    log(`Nombre: ${err.name || "N/A"}`, "err");
    log(`Mensaje: ${err.message || "Sin mensaje descriptivo"}`, "err");
    log(`Código: ${err.code || "N/A"}`, "err");
    if (err.stack) {
      log(`Stack: ${err.stack.split("\n")[0]}`, "warn");
    }
  }

  function resize() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
    draw();
  }
  window.addEventListener("resize", resize);
  resize();

  // 1. Sensores iOS
  btnSensors.addEventListener("click", async () => {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      try {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res === "granted") {
          window.addEventListener("deviceorientation", handleOrientation, true);
          btnSensors.disabled = true;
          btnSensors.innerText = "Brújula OK";
          log("Sensores de orientación activados.", "ok");
        } else {
          log("Permiso denegado por el usuario.", "err");
        }
      } catch (e) {
        logErrorDetails(e, "Permisos de Brújula");
      }
    } else {
      window.addEventListener("deviceorientation", handleOrientation, true);
      btnSensors.disabled = true;
      btnSensors.innerText = "Brújula OK";
      log("Brújula enlazada directamente.", "ok");
    }
  });

  function handleOrientation(e) {
    if (e.webkitCompassHeading !== undefined) {
      currentHeading = e.webkitCompassHeading;
    } else if (e.alpha !== null) {
      currentHeading = (360 - e.alpha) % 360;
    }

    let eff = currentHeading;
    if (orthoEnabled) {
      eff = Math.round(eff / 90) * 90 % 360;
    }

    lblHeading.innerText = currentHeading.toFixed(1);
    lblSnapped.innerText = eff.toFixed(0);
  }

  btnOrtho.addEventListener("click", () => {
    orthoEnabled = !orthoEnabled;
    btnOrtho.innerText = `ORTO: ${orthoEnabled ? "ON" : "OFF"}`;
    btnOrtho.classList.toggle("active", orthoEnabled);
    log(`Modo Ortogonal: ${orthoEnabled ? "ON" : "OFF"}`);
  });

  // 2. Conexión BLE con escaneo y diagnóstico profundo
  btnBLE.addEventListener("click", async () => {
    let currentStage = "Inicialización";
    
    if (!navigator.bluetooth) {
      log("navigator.bluetooth NO existe en este navegador.", "err");
      return;
    }

    try {
      currentStage = "Escaneo de Dispositivo";
      log("Iniciando escaneo BLE...", "info");

      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: CANDIDATE_SERVICES
      });

      if (!device) {
        throw new Error("No se seleccionó ningún dispositivo del diálogo.");
      }

      log(`Dispositivo: ${device.name || "Sin nombre"} | ID: ${device.id}`, "ok");

      device.addEventListener("gattserverdisconnected", () => {
        log("AVISO: El dispositivo se ha desconectado.", "warn");
        btnBLE.disabled = false;
        btnBLE.innerText = "2. Conectar GLM";
        btnBLE.classList.remove("active");
      });

      currentStage = "Conexión GATT Server";
      log("Conectando al servidor GATT...", "info");
      const server = await device.gatt.connect();
      log("Servidor GATT conectado.", "ok");

      currentStage = "Descubrimiento de Servicios";
      log("Buscando servicios primarios...", "info");

      let services = [];
      try {
        services = await server.getPrimaryServices();
        log(`Servicios descubiertos: ${services.length}`, "ok");
        services.forEach((s, idx) => log(`[Srv ${idx}] ${s.uuid}`, "info"));
      } catch (svcErr) {
        log(`getPrimaryServices() no permitido o falló: ${svcErr.message || svcErr}`, "warn");
      }

      // Si getPrimaryServices falla, iterar candidatos de forma individual
      let activeService = null;
      if (services.length > 0) {
        activeService = services.find(s => CANDIDATE_SERVICES.includes(s.uuid.toLowerCase())) || services[0];
      } else {
        for (const uuid of CANDIDATE_SERVICES) {
          try {
            currentStage = `Consulta directa de servicio ${uuid}`;
            activeService = await server.getPrimaryService(uuid);
            if (activeService) {
              log(`Servicio obtenido de forma directa: ${uuid}`, "ok");
              break;
            }
          } catch (ignore) {}
        }
      }

      if (!activeService) {
        throw new Error("No fue posible obtener ningún servicio utilizable en el telémetro.");
      }

      currentStage = `Lectura de Características del Servicio ${activeService.uuid}`;
      log(`Explorando características en: ${activeService.uuid}...`, "info");
      const characteristics = await activeService.getCharacteristics();
      log(`Características encontradas: ${characteristics.length}`, "ok");

      let notifyChar = null;
      for (const c of characteristics) {
        const p = c.properties;
        log(`-> Char: ${c.uuid} | read:${p.read} write:${p.write || p.writeWithoutResponse} notify:${p.notify} indicate:${p.indicate}`, "info");
        if ((p.notify || p.indicate) && !notifyChar) {
          notifyChar = c;
        }
      }

      if (!notifyChar) {
        throw new Error("Ninguna característica del servicio admite notificaciones.");
      }

      currentStage = `Suscripción a Notificaciones en ${notifyChar.uuid}`;
      log(`Suscribiendo a eventos en: ${notifyChar.uuid}...`, "info");
      await notifyChar.startNotifications();
      
      notifyChar.addEventListener("characteristicvaluechanged", (e) => {
        const val = e.target.value;
        const rawHex = Array.from(new Uint8Array(val.buffer)).map(b => b.toString(16).padStart(2, '0')).join(' ');
        log(`RX Data (${val.byteLength}b): ${rawHex}`, "info");

        if (val.byteLength >= 8) {
          const rawDist = val.getUint32(4, true);
          const meters = rawDist / 1000.0;
          if (meters > 0 && meters < 150) {
            processVector(meters);
          }
        }
      });
      log("Suscripción activa. Listo para recibir pulsos del GLM.", "ok");

      // Intento de envío de inicialización
      if (notifyChar.properties.write || notifyChar.properties.writeWithoutResponse) {
        try {
          currentStage = "Comando de Inicialización Bosch";
          await notifyChar.writeValue(new Uint8Array([0xc0, 0x55, 0x02, 0x01, 0x00, 0x1a]));
          log("Comando de sincronización enviado correctamente.", "ok");
        } catch (wErr) {
          log(`Escritura de sincronización omitida: ${wErr.message || wErr}`, "warn");
        }
      }

      btnBLE.disabled = true;
      btnBLE.innerText = "GLM Conectado";
      btnBLE.classList.add("active");
      btnDxf.disabled = false;

    } catch (err) {
      logErrorDetails(err, currentStage);
    }
  });

  function processVector(distance) {
    lblDist.innerText = distance.toFixed(3);

    let angleDeg = currentHeading;
    if (orthoEnabled) {
      angleDeg = Math.round(angleDeg / 90) * 90 % 360;
    }

    const cartesianRad = (90 - angleDeg) * (Math.PI / 180);
    const dx = distance * Math.cos(cartesianRad);
    const dy = distance * Math.sin(cartesianRad);

    const last = points[points.length - 1];
    const next = { x: last.x + dx, y: last.y + dy };
    points.push(next);

    lblPts.innerText = points.length;
    log(`Punto #${points.length}: ${distance.toFixed(3)}m @ ${angleDeg.toFixed(0)}° -> (${next.x.toFixed(2)}, ${next.y.toFixed(2)})`, "ok");
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (points.length < 2) return;

    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    points.forEach(p => {
      minX = Math.min(minX, p.x);
      maxX = Math.max(maxX, p.x);
      minY = Math.min(minY, p.y);
      maxY = Math.max(maxY, p.y);
    });

    const spanX = Math.max(maxX - minX, 0.5);
    const spanY = Math.max(maxY - minY, 0.5);
    const pad = 35;

    const scale = Math.min(
      (canvas.width - pad * 2) / spanX,
      (canvas.height - pad * 2) / spanY
    );

    const toScreen = (p) => ({
      x: pad + (p.x - minX) * scale,
      y: canvas.height - (pad + (p.y - minY) * scale)
    });

    ctx.beginPath();
    ctx.strokeStyle = "#30d158";
    ctx.lineWidth = 2.5;
    const p0 = toScreen(points[0]);
    ctx.moveTo(p0.x, p0.y);

    for (let i = 1; i < points.length; i++) {
      const pi = toScreen(points[i]);
      ctx.lineTo(pi.x, pi.y);
    }
    ctx.stroke();

    points.forEach((p, idx) => {
      const pi = toScreen(p);
      ctx.fillStyle = idx === points.length - 1 ? "#ff453a" : "#ffffff";
      ctx.beginPath();
      ctx.arc(pi.x, pi.y, 4, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  btnDxf.addEventListener("click", () => {
    if (points.length < 2) return;

    let dxf = "0\nSECTION\n2\nENTITIES\n";
    for (let i = 0; i < points.length - 1; i++) {
      const a = points[i];
      const b = points[i + 1];
      dxf += "0\nLINE\n8\nLEVANTAMIENTO\n";
      dxf += `10\n${a.x.toFixed(4)}\n20\n${a.y.toFixed(4)}\n30\n0.0\n`;
      dxf += `11\n${b.x.toFixed(4)}\n21\n${b.y.toFixed(4)}\n31\n0.0\n`;
    }
    dxf += "0\nENDSEC\n0\nEOF\n";

    const blob = new Blob([dxf], { type: "application/dxf" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `levantamiento_${Date.now()}.dxf`;
    link.click();
    URL.revokeObjectURL(url);
    log("DXF generado y descargado.", "ok");
  });

  btnClear.addEventListener("click", () => {
    points = [{ x: 0, y: 0 }];
    lblPts.innerText = "1";
    lblDist.innerText = "0.000";
    log("Trazado reiniciado.");
    draw();
  });
</script>
</body>
</html>
