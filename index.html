<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GLM 120 C - Vectorizador</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { background: #111; color: #eee; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { 
      padding: 8px; 
      background: #1c1c1e; 
      display: flex; 
      gap: 6px; 
      flex-wrap: wrap; 
      border-bottom: 1px solid #333; 
    }
    
    button { 
      background: #007aff; 
      color: #fff; 
      border: none; 
      padding: 8px 10px; 
      border-radius: 6px; 
      font-weight: 600; 
      font-size: 0.75rem; 
      cursor: pointer; 
      touch-action: manipulation;
    }
    button.active { background: #34c759; }
    button:disabled { background: #2c2c2e; color: #666; }

    #telemetry { 
      display: flex; 
      justify-content: space-around; 
      background: #000; 
      padding: 6px 4px; 
      font-size: 0.75rem; 
      color: #30d158; 
      border-bottom: 1px solid #222; 
    }

    #canvas-box { 
      flex: 1; 
      position: relative; 
      background: #181818; 
    }
    
    canvas { 
      width: 100%; 
      height: 100%; 
      display: block; 
    }

    #log { 
      height: 100px; 
      overflow-y: auto; 
      background: #0d0d0d; 
      padding: 8px; 
      font-size: 0.7rem; 
      border-top: 1px solid #333; 
      color: #aaa;
      line-height: 1.4;
    }
    #log div { border-bottom: 1px solid #1a1a1a; padding: 2px 0; }
  </style>
</head>
<body>

<header>
  <button id="btnSensors">1. Activar Brújula</button>
  <button id="btnBLE">2. Conectar GLM</button>
  <button id="btnOrtho">ORTO: OFF</button>
  <button id="btnDxf" disabled>Exportar DXF</button>
  <button id="btnClear">Reset</button>
</header>

<div id="telemetry">
  <span>Rumbo: <b id="lblHeading">--</b>°</span>
  <span>Snap: <b id="lblSnapped">--</b>°</span>
  <span>Dist: <b id="lblDist">0.000</b> m</span>
  <span>Pts: <b id="lblPts">1</b></span>
</div>

<div id="canvas-box">
  <canvas id="stage"></canvas>
</div>

<div id="log">Esperando inicialización. Ejecutar en Bluefy (iOS).</div>

<script>
  // UUIDs oficiales y variantes del protocolo Bosch GLM
  const BOSCH_SERVICES = [
    "00005301-0000-0041-4c53-53494e535452", // Servicio estándar de telemetría GLM
    "00000001-0000-1000-8000-00805f9b34fb"  // Variante Bosch
  ];

  let currentHeading = 0;
  let orthoEnabled = false;
  let points = [{ x: 0, y: 0 }];

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const logDiv = document.getElementById("log");
  const lblHeading = document.getElementById("lblHeading");
  const lblSnapped = document.getElementById("lblSnapped");
  const lblDist = document.getElementById("lblDist");
  const lblPts = document.getElementById("lblPts");

  const btnSensors = document.getElementById("btnSensors");
  const btnBLE = document.getElementById("btnBLE");
  const btnOrtho = document.getElementById("btnOrtho");
  const btnDxf = document.getElementById("btnDxf");
  const btnClear = document.getElementById("btnClear");

  function log(msg) {
    const entry = document.createElement("div");
    entry.textContent = `> ${msg}`;
    logDiv.appendChild(entry);
    logDiv.scrollTop = logDiv.scrollHeight;
  }

  function resize() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
    draw();
  }
  window.addEventListener("resize", resize);
  resize();

  // 1. Sensores de orientación iOS
  btnSensors.addEventListener("click", async () => {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      try {
        const response = await DeviceOrientationEvent.requestPermission();
        if (response === "granted") {
          window.addEventListener("deviceorientation", handleOrientation, true);
          btnSensors.disabled = true;
          btnSensors.innerText = "Brújula OK";
          log("Brújula activada correctamente.");
        } else {
          log("Permiso de brújula denegado.");
        }
      } catch (err) {
        log("Error en brújula: " + (err.message || err));
      }
    } else {
      window.addEventListener("deviceorientation", handleOrientation, true);
      btnSensors.disabled = true;
      btnSensors.innerText = "Brújula OK";
      log("Brújula enlazada.");
    }
  });

  function handleOrientation(e) {
    if (e.webkitCompassHeading !== undefined) {
      currentHeading = e.webkitCompassHeading;
    } else if (e.alpha !== null) {
      currentHeading = (360 - e.alpha) % 360;
    }

    let effective = currentHeading;
    if (orthoEnabled) {
      effective = Math.round(effective / 90) * 90 % 360;
    }

    lblHeading.innerText = currentHeading.toFixed(1);
    lblSnapped.innerText = effective.toFixed(0);
  }

  // Modo Ortogonal
  btnOrtho.addEventListener("click", () => {
    orthoEnabled = !orthoEnabled;
    btnOrtho.innerText = `ORTO: ${orthoEnabled ? "ON" : "OFF"}`;
    btnOrtho.classList.toggle("active", orthoEnabled);
    log(`Modo Ortogonal: ${orthoEnabled ? "Activado" : "Desactivado"}`);
  });

  // 2. Conexión BLE con manejo seguro de errores
  btnBLE.addEventListener("click", async () => {
    log("Verificando API Bluetooth...");

    if (!navigator.bluetooth) {
      log("ERROR: navigator.bluetooth no disponible. Abre en Bluefy (App Store), no en Safari.");
      return;
    }

    try {
      log("Buscando dispositivo...");
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: BOSCH_SERVICES
      });

      if (!device) {
        log("Selección cancelada.");
        return;
      }

      log(`Conectando a: ${device.name || "GLM Dispositivo"}...`);
      const server = await device.gatt.connect();

      let service = null;
      let activeServiceUuid = null;

      for (const uuid of BOSCH_SERVICES) {
        try {
          service = await server.getPrimaryService(uuid);
          if (service) {
            activeServiceUuid = uuid;
            break;
          }
        } catch (e) {
          // Busca el siguiente UUID
        }
      }

      if (!service) {
        throw new Error("Servicio GATT Bosch no detectado en el dispositivo.");
      }

      log(`Servicio activo: ${activeServiceUuid}`);
      const characteristics = await service.getCharacteristics();
      if (!characteristics || characteristics.length === 0) {
        throw new Error("No se encontraron características GATT.");
      }

      // Buscar característica con soporte de notificación
      let dataChar = characteristics.find(c => c.properties.notify || c.properties.indicate) || characteristics[0];

      await dataChar.startNotifications();
      dataChar.addEventListener("characteristicvaluechanged", (e) => {
        const val = e.target.value;
        if (val && val.byteLength >= 8) {
          const rawDist = val.getUint32(4, true);
          const meters = rawDist / 1000.0;
          if (meters > 0 && meters < 150) {
            processVector(meters);
          }
        }
      });

      // Inicialización de telemetría continua
      if (dataChar.properties.write || dataChar.properties.writeWithoutResponse) {
        try {
          await dataChar.writeValue(new Uint8Array([0xc0, 0x55, 0x02, 0x01, 0x00, 0x1a]));
        } catch (wErr) {
          // Manejo no bloqueante de escritura
        }
      }

      btnBLE.disabled = true;
      btnBLE.innerText = "GLM Conectado";
      btnDxf.disabled = false;
      log("GLM listo. Realiza mediciones desde el telémetro.");

    } catch (err) {
      const msg = err && (err.message || err.name) ? (err.message || err.name) : JSON.stringify(err);
      log(`Error BLE: ${msg}`);
    }
  });

  // Procesar distancia y rumbo
  function processVector(distance) {
    lblDist.innerText = distance.toFixed(3);

    let angleDeg = currentHeading;
    if (orthoEnabled) {
      angleDeg = Math.round(angleDeg / 90) * 90 % 360;
    }

    // Azimut (0° Norte, horario) a Radianes Cartesianos (0° Este, antihorario)
    const cartesianRad = (90 - angleDeg) * (Math.PI / 180);

    const dx = distance * Math.cos(cartesianRad);
    const dy = distance * Math.sin(cartesianRad);

    const last = points[points.length - 1];
    const next = { x: last.x + dx, y: last.y + dy };
    points.push(next);

    lblPts.innerText = points.length;
    log(`Medición: ${distance.toFixed(3)}m @ ${angleDeg.toFixed(0)}° -> (${next.x.toFixed(2)}, ${next.y.toFixed(2)})`);

    draw();
  }

  // Trazado en Canvas 2D
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (points.length < 2) return;

    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    points.forEach(p => {
      minX = Math.min(minX, p.x);
      maxX = Math.max(maxX, p.x);
      minY = Math.min(minY, p.y);
      maxY = Math.max(maxY, p.y);
    });

    const spanX = Math.max(maxX - minX, 0.5);
    const spanY = Math.max(maxY - minY, 0.5);
    const pad = 30;

    const scale = Math.min(
      (canvas.width - pad * 2) / spanX,
      (canvas.height - pad * 2) / spanY
    );

    const toScreen = (p) => ({
      x: pad + (p.x - minX) * scale,
      y: canvas.height - (pad + (p.y - minY) * scale)
    });

    // Líneas
    ctx.beginPath();
    ctx.strokeStyle = "#30d158";
    ctx.lineWidth = 2;
    const p0 = toScreen(points[0]);
    ctx.moveTo(p0.x, p0.y);

    for (let i = 1; i < points.length; i++) {
      const pi = toScreen(points[i]);
      ctx.lineTo(pi.x, pi.y);
    }
    ctx.stroke();

    // Vértices
    points.forEach((p, idx) => {
      const pi = toScreen(p);
      ctx.fillStyle = idx === points.length - 1 ? "#ff453a" : "#ffffff";
      ctx.beginPath();
      ctx.arc(pi.x, pi.y, 4, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  // Exportar DXF R12
  btnDxf.addEventListener("click", () => {
    if (points.length < 2) return;

    let dxf = "0\nSECTION\n2\nENTITIES\n";
    for (let i = 0; i < points.length - 1; i++) {
      const a = points[i];
      const b = points[i + 1];
      dxf += "0\nLINE\n8\nLEVANTAMIENTO\n";
      dxf += `10\n${a.x.toFixed(4)}\n20\n${a.y.toFixed(4)}\n30\n0.0\n`;
      dxf += `11\n${b.x.toFixed(4)}\n21\n${b.y.toFixed(4)}\n31\n0.0\n`;
    }
    dxf += "0\nENDSEC\n0\nEOF\n";

    const blob = new Blob([dxf], { type: "application/dxf" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `levantamiento_${Date.now()}.dxf`;
    link.click();
    URL.revokeObjectURL(url);
    log("Archivo DXF generado y descargado.");
  });

  btnClear.addEventListener("click", () => {
    points = [{ x: 0, y: 0 }];
    lblPts.innerText = "1";
    lblDist.innerText = "0.000";
    log("Vértices reiniciados al origen (0,0).");
    draw();
  });
</script>
</body>
</html>
