<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AutoCAD R14 - GLM Vectorizer</title>
  <style>
    :root {
      --acad-bg: #000000;
      --acad-win-bg: #c0c0c0;
      --acad-win-btn: #c0c0c0;
      --acad-win-border-light: #ffffff;
      --acad-win-border-dark: #808080;
      --acad-win-border-darker: #000000;
      --acad-cmd-bg: #ffffff;
      --acad-cmd-txt: #000000;
      --acad-crosshair: #ffffff;
      --acad-cyan: #00ffff;
      --acad-yellow: #ffff00;
      --acad-green: #00ff00;
      --acad-red: #ff0000;
      --acad-magenta: #ff00ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }
    body { 
      background: var(--acad-win-bg); 
      color: #000000; 
      font-family: 'MS Sans Serif', Tahoma, 'Consolas', monospace; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
    }

    /* Barra Superior Windows 95 / AutoCAD R14 */
    #title-bar {
      background: #000080;
      color: #ffffff;
      padding: 3px 6px;
      font-weight: bold;
      font-size: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--acad-win-border-light);
    }

    /* Barra de Herramientas R14 */
    #toolbar {
      background: var(--acad-win-bg);
      border-top: 1px solid var(--acad-win-border-light);
      border-bottom: 2px solid var(--acad-win-border-dark);
      padding: 4px;
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
    }

    .btn-r14 {
      background: var(--acad-win-btn);
      color: #000000;
      border-top: 2px solid var(--acad-win-border-light);
      border-left: 2px solid var(--acad-win-border-light);
      border-right: 2px solid var(--acad-win-border-darker);
      border-bottom: 2px solid var(--acad-win-border-darker);
      padding: 4px 7px;
      font-size: 0.68rem;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      touch-action: manipulation;
    }
    .btn-r14:active, .btn-r14.pressed {
      border-top: 2px solid var(--acad-win-border-darker);
      border-left: 2px solid var(--acad-win-border-darker);
      border-right: 2px solid var(--acad-win-border-light);
      border-bottom: 2px solid var(--acad-win-border-light);
      background: #a0a0a0;
    }
    .btn-r14:disabled {
      color: #808080;
      text-shadow: 1px 1px 0 #ffffff;
      border-color: #808080;
    }

    /* Coordenadas y Estados (Barra inferior R14) */
    #status-bar {
      background: var(--acad-win-bg);
      border-top: 2px solid var(--acad-win-border-light);
      border-bottom: 1px solid var(--acad-win-border-dark);
      padding: 2px 6px;
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      font-family: 'Consolas', monospace;
    }
    .status-panel {
      border-top: 1px solid var(--acad-win-border-dark);
      border-left: 1px solid var(--acad-win-border-dark);
      border-right: 1px solid var(--acad-win-border-light);
      border-bottom: 1px solid var(--acad-win-border-light);
      padding: 1px 5px;
      background: #d4d0c8;
      font-weight: bold;
    }

    /* Viewport Negro R14 */
    #viewport-container {
      flex: 1;
      position: relative;
      background: var(--acad-bg);
      touch-action: none;
      border-top: 2px solid var(--acad-win-border-darker);
      border-left: 2px solid var(--acad-win-border-darker);
      border-right: 2px solid var(--acad-win-border-light);
      border-bottom: 2px solid var(--acad-win-border-light);
      margin: 2px;
    }
    canvas { width: 100%; height: 100%; display: block; }

    /* Línea de Comandos Blanca Clásica R14 */
    #cmd-container {
      height: 90px;
      background: var(--acad-cmd-bg);
      border-top: 2px solid var(--acad-win-border-darker);
      border-left: 2px solid var(--acad-win-border-darker);
      border-right: 2px solid var(--acad-win-border-light);
      border-bottom: 2px solid var(--acad-win-border-light);
      margin: 2px;
      padding: 4px;
      font-size: 0.70rem;
      font-family: 'Consolas', monospace;
      color: var(--acad-cmd-txt);
      overflow-y: auto;
      line-height: 1.3;
    }
    .cmd-line-text { white-space: pre-wrap; }
    .cmd-prompt { font-weight: bold; }
  </style>
</head>
<body>

<div id="title-bar">
  <span>AutoCAD - [UNNAMED.DWG - R14]</span>
  <span style="font-size:0.65rem;">BOSCH GLM 120 C</span>
</div>

<div id="toolbar">
  <button id="btnSensors" class="btn-r14">BRÚJULA</button>
  <button id="btnBLE" class="btn-r14">ENLACE BLE</button>
  <button id="btnOrtho" class="btn-r14">F8 [ORTO]</button>
  <button id="btnAngleManual" class="btn-r14">&lt; ÁNGULO</button>
  <button id="btnDistManual" class="btn-r14">DISTANCIA</button>
  <button id="btnUndo" class="btn-r14" disabled>DESHACER [U]</button>
  <button id="btnRedo" class="btn-r14" disabled>REHACER</button>
  <button id="btnSetBase" class="btn-r14">PTO BASE</button>
  <button id="btnClosePoly" class="btn-r14">CERRAR [C]</button>
  <button id="btnDxf" class="btn-r14" disabled>DXF</button>
  <button id="btnClear" class="btn-r14">NUEVO</button>
</div>

<div id="status-bar">
  <span class="status-panel" id="panelCoords">0.0000, 0.0000, 0.0000</span>
  <span class="status-panel" id="panelAngle">ÁNGULO: 0° [BLOQ]</span>
  <span class="status-panel" id="panelDist">DIST: 0.000m</span>
  <span class="status-panel" id="panelOrtho">ORTO</span>
</div>

<div id="viewport-container">
  <canvas id="acadCanvas"></canvas>
</div>

<div id="cmd-container">
  <div class="cmd-line-text"><span class="cmd-prompt">Comando:</span> _LINE Especifique primer punto: (0.0, 0.0)</div>
  <div class="cmd-line-text"><span class="cmd-prompt">Comando:</span> Orientación bloqueada. Toque o arrastre el dial para cambiar el rumbo.</div>
</div>

<script>
  const SERVICE_DATA = "02A6C0D0-0451-4000-B000-FB3210111989";
  const CHAR_TX_RX   = "02A6C0D1-0451-4000-B000-FB3210111989";

  let lines = [];
  let redoStack = [];
  let activeBasePoint = { x: 0, y: 0 };
  let lockedAngle = 0; // Ángulo bloqueado activo (grados cartesianos: 0°=Este, 90°=Norte, 180°=Oeste, 270°=Sur)
  let currentCompassHeading = 0;
  let orthoEnabled = true;
  let isPickingOrigin = false;
  let isDraggingDial = false;
  let isPanning = false;
  let lastMeasuredDist = 0.0;

  // Parámetros Cámara Viewport
  let viewOffset = { x: 0, y: 0 };
  let viewScale = 50.0; // Píxeles por metro

  // Dimensiones del Dial de Orientación CAD
  const DIAL_RADIUS = 60;
  const ARROW_HEAD = 12;

  const canvas = document.getElementById("acadCanvas");
  const ctx = canvas.getContext("2d");
  const cmdBox = document.getElementById("cmd-container");

  const panelCoords = document.getElementById("panelCoords");
  const panelAngle = document.getElementById("panelAngle");
  const panelDist = document.getElementById("panelDist");
  const panelOrtho = document.getElementById("panelOrtho");

  const btnSensors = document.getElementById("btnSensors");
  const btnBLE = document.getElementById("btnBLE");
  const btnOrtho = document.getElementById("btnOrtho");
  const btnAngleManual = document.getElementById("btnAngleManual");
  const btnDistManual = document.getElementById("btnDistManual");
  const btnUndo = document.getElementById("btnUndo");
  const btnRedo = document.getElementById("btnRedo");
  const btnSetBase = document.getElementById("btnSetBase");
  const btnClosePoly = document.getElementById("btnClosePoly");
  const btnDxf = document.getElementById("btnDxf");
  const btnClear = document.getElementById("btnClear");

  function printCmd(text) {
    const line = document.createElement("div");
    line.className = "cmd-line-text";
    line.innerHTML = `<span class="cmd-prompt">Comando:</span> ${text}`;
    cmdBox.appendChild(line);
    cmdBox.scrollTop = cmdBox.scrollHeight;
  }

  function resizeViewport() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
    if (lines.length === 0 && activeBasePoint.x === 0 && activeBasePoint.y === 0) {
      viewOffset.x = canvas.width / 2;
      viewOffset.y = canvas.height / 2;
    }
    renderScene();
  }
  window.addEventListener("resize", resizeViewport);
  resizeViewport();

  function updateStatusPanels() {
    panelCoords.innerText = `${activeBasePoint.x.toFixed(4)}, ${activeBasePoint.y.toFixed(4)}, 0.0000`;
    panelAngle.innerText = `ÁNGULO: ${lockedAngle.toFixed(0)}° [BLOQ]`;
    panelDist.innerText = `DIST: ${lastMeasuredDist.toFixed(3)}m`;
    panelOrtho.style.color = orthoEnabled ? "#000000" : "#808080";
    btnUndo.disabled = lines.length === 0;
    btnRedo.disabled = redoStack.length === 0;
    btnDxf.disabled = lines.length === 0;
    btnOrtho.classList.toggle("pressed", orthoEnabled);
  }

  // Conversión Geometría Mundo <-> Pantalla
  function worldToScreen(wx, wy) {
    return {
      x: viewOffset.x + wx * viewScale,
      y: viewOffset.y - wy * viewScale
    };
  }

  function screenToWorld(sx, sy) {
    return {
      x: (sx - viewOffset.x) / viewScale,
      y: -(sy - viewOffset.y) / viewScale
    };
  }

  // 1. Sensores de Orientación
  btnSensors.addEventListener("click", async () => {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      try {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res === "granted") {
          window.addEventListener("deviceorientation", handleDeviceOrientation, true);
          btnSensors.disabled = true;
          btnSensors.classList.add("pressed");
          printCmd("Brújula activada. Alinee el teléfono y pulse la flecha para transferir rumbo.");
        }
      } catch (e) {
        printCmd("Error al inicializar sensor de rumbo.");
      }
    } else {
      window.addEventListener("deviceorientation", handleDeviceOrientation, true);
      btnSensors.disabled = true;
      btnSensors.classList.add("pressed");
      printCmd("Brújula enlazada.");
    }
  });

  function handleDeviceOrientation(e) {
    if (e.webkitCompassHeading !== undefined) {
      currentCompassHeading = e.webkitCompassHeading;
    } else if (e.alpha !== null) {
      currentCompassHeading = (360 - e.alpha) % 360;
    }
    renderScene();
  }

  // F8 - Modo Ortogonal
  btnOrtho.addEventListener("click", () => {
    orthoEnabled = !orthoEnabled;
    if (orthoEnabled) {
      lockedAngle = Math.round(lockedAngle / 90) * 90 % 360;
      if (lockedAngle < 0) lockedAngle += 360;
    }
    updateStatusPanels();
    printCmd(`_ORTHO ${orthoEnabled ? "Activado" : "Desactivado"}`);
    renderScene();
  });

  // Ingreso Manual de Ángulo (<)
  btnAngleManual.addEventListener("click", () => {
    const input = prompt("Especifique ángulo de orientación (grados cartesianos 0=E, 90=N, 180=O, 270=S):", lockedAngle);
    if (input !== null) {
      let deg = parseFloat(input);
      if (!isNaN(deg)) {
        deg = (deg % 360 + 360) % 360;
        if (orthoEnabled) deg = Math.round(deg / 90) * 90 % 360;
        lockedAngle = deg;
        updateStatusPanels();
        printCmd(`_POLAR ÁNGULO fijado en ${lockedAngle}°`);
        renderScene();
      }
    }
  });

  // Ingreso Manual de Distancia
  btnDistManual.addEventListener("click", () => {
    const input = prompt("Especifique longitud del segmento (metros):", lastMeasuredDist > 0 ? lastMeasuredDist.toFixed(3) : "");
    if (input !== null) {
      const d = parseFloat(input.replace(",", "."));
      if (!isNaN(d) && d > 0) {
        commitSegment(d);
      }
    }
  });

  // Deshacer [U]
  btnUndo.addEventListener("click", () => {
    if (lines.length === 0) return;
    const removed = lines.pop();
    redoStack.push(removed);
    activeBasePoint = { x: removed.x1, y: removed.y1 };
    updateStatusPanels();
    printCmd(`_U Línea L=${removed.dist.toFixed(3)}m deshecha.`);
    renderScene();
  });

  // Rehacer
  btnRedo.addEventListener("click", () => {
    if (redoStack.length === 0) return;
    const restored = redoStack.pop();
    const dx = restored.x2 - restored.x1;
    const dy = restored.y2 - restored.y1;
    lines.push({
      x1: activeBasePoint.x,
      y1: activeBasePoint.y,
      x2: activeBasePoint.x + dx,
      y2: activeBasePoint.y + dy,
      dist: restored.dist,
      angle: restored.angle
    });
    activeBasePoint = { x: activeBasePoint.x + dx, y: activeBasePoint.y + dy };
    updateStatusPanels();
    printCmd(`_REDO Línea L=${restored.dist.toFixed(3)}m restaurada.`);
    renderScene();
  });

  // Reposicionar Punto Base (Pick Point)
  btnSetBase.addEventListener("click", () => {
    isPickingOrigin = !isPickingOrigin;
    btnSetBase.classList.toggle("pressed", isPickingOrigin);
    printCmd(isPickingOrigin ? "Indique nuevo punto de inserción en el viewport:" : "Cancelado.");
  });

  // Cerrar Polígono [C]
  btnClosePoly.addEventListener("click", () => {
    if (lines.length < 2) {
      printCmd("Requiere al menos 2 segmentos para cerrar.");
      return;
    }
    const origin = { x: lines[0].x1, y: lines[0].y1 };
    const d = Math.hypot(origin.x - activeBasePoint.x, origin.y - activeBasePoint.y);
    if (d > 0.001) {
      redoStack = [];
      lines.push({
        x1: activeBasePoint.x,
        y1: activeBasePoint.y,
        x2: origin.x,
        y2: origin.y,
        dist: d,
        angle: (Math.atan2(origin.y - activeBasePoint.y, origin.x - activeBasePoint.x) * 180 / Math.PI + 360) % 360
      });
      activeBasePoint = { x: origin.x, y: origin.y };
      updateStatusPanels();
      printCmd(`_CLOSE Polígono cerrado. Perímetro consolidado.`);
      renderScene();
    }
  });

  // 2. Interacción Táctil: Dial de Orientación, Pick Point y Pan
  let touchStart = { x: 0, y: 0 };

  canvas.addEventListener("touchstart", (e) => {
    if (e.touches.length === 1) {
      const t = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const sx = t.clientX - rect.left;
      const sy = t.clientY - rect.top;
      touchStart = { x: sx, y: sy };

      const baseScr = worldToScreen(activeBasePoint.x, activeBasePoint.y);
      const distToDial = Math.hypot(sx - baseScr.x, sy - baseScr.y);

      // Si se pulsa cerca del dial o la flecha: activar arrastre y rotación manual
      if (!isPickingOrigin && distToDial <= DIAL_RADIUS + 25) {
        isDraggingDial = true;
        updateAngleFromPointer(sx, sy, baseScr);
      } else {
        isPanning = true;
      }
    }
  }, { passive: false });

  canvas.addEventListener("touchmove", (e) => {
    if (e.touches.length === 1) {
      const t = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const sx = t.clientX - rect.left;
      const sy = t.clientY - rect.top;

      const baseScr = worldToScreen(activeBasePoint.x, activeBasePoint.y);

      if (isDraggingDial) {
        e.preventDefault();
        updateAngleFromPointer(sx, sy, baseScr);
      } else if (isPanning && !isPickingOrigin) {
        const dx = sx - touchStart.x;
        const dy = sy - touchStart.y;
        if (Math.hypot(dx, dy) > 5) {
          viewOffset.x += dx;
          viewOffset.y += dy;
          touchStart = { x: sx, y: sy };
          renderScene();
        }
      }
    }
  }, { passive: false });

  canvas.addEventListener("touchend", () => {
    if (isDraggingDial) {
      isDraggingDial = false;
      printCmd(`Orientación bloqueada en: ${lockedAngle.toFixed(0)}°`);
    } else if (isPickingOrigin) {
      const w = screenToWorld(touchStart.x, touchStart.y);
      activeBasePoint = { x: w.x, y: w.y };
      isPickingOrigin = false;
      btnSetBase.classList.remove("pressed");
      updateStatusPanels();
      printCmd(`Punto base situado en: (${w.x.toFixed(4)}, ${w.y.toFixed(4)})`);
      renderScene();
    }
    isPanning = false;
  });

  // Ajuste y bloqueo del ángulo mediante arrastre del dial
  function updateAngleFromPointer(sx, sy, baseScr) {
    const dx = sx - baseScr.x;
    const dy = baseScr.y - sy; // Eje Y cartesiano invertido respecto a pantalla
    let deg = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;

    if (orthoEnabled) {
      deg = Math.round(deg / 90) * 90 % 360;
    }
    lockedAngle = deg;
    updateStatusPanels();
    renderScene();
  }

  // 3. Ejecución de Trazo con Distancia Consolidada
  function commitSegment(dist) {
    lastMeasuredDist = dist;
    redoStack = [];

    const rad = lockedAngle * (Math.PI / 180);
    const tx = activeBasePoint.x + dist * Math.cos(rad);
    const ty = activeBasePoint.y + dist * Math.sin(rad);

    lines.push({
      x1: activeBasePoint.x,
      y1: activeBasePoint.y,
      x2: tx,
      y2: ty,
      dist: dist,
      angle: lockedAngle
    });

    activeBasePoint = { x: tx, y: ty };
    updateStatusPanels();
    printCmd(`_LINE longitud=${dist.toFixed(3)}m ángulo=${lockedAngle.toFixed(0)}° -> (${tx.toFixed(3)}, ${ty.toFixed(3)})`);
    
    fitAutoBounds();
    renderScene();
  }

  function fitAutoBounds() {
    if (lines.length === 0) return;
    let minX = activeBasePoint.x, maxX = activeBasePoint.x;
    let minY = activeBasePoint.y, maxY = activeBasePoint.y;

    lines.forEach(l => {
      minX = Math.min(minX, l.x1, l.x2);
      maxX = Math.max(maxX, l.x1, l.x2);
      minY = Math.min(minY, l.y1, l.y2);
      maxY = Math.max(maxY, l.y1, l.y2);
    });

    const spanX = Math.max(maxX - minX, 1.0);
    const spanY = Math.max(maxY - minY, 1.0);
    const pad = 90;

    viewScale = Math.min(
      (canvas.width - pad * 2) / spanX,
      (canvas.height - pad * 2) / spanY
    );
    viewScale = Math.max(10, Math.min(viewScale, 180));

    viewOffset.x = canvas.width / 2 - ((minX + maxX) / 2) * viewScale;
    viewOffset.y = canvas.height / 2 + ((minY + maxY) / 2) * viewScale;
  }

  // 4. Enlace Bluetooth GLM 120 C
  btnBLE.addEventListener("click", async () => {
    try {
      printCmd("Buscando dispositivo Bosch GLM 120 C...");
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERVICE_DATA, SERVICE_DATA.toLowerCase()]
      });

      printCmd(`Conectando a: ${device.name}...`);
      const server = await device.gatt.connect();

      let service;
      try {
        service = await server.getPrimaryService(SERVICE_DATA);
      } catch (e) {
        service = await server.getPrimaryService(SERVICE_DATA.toLowerCase());
      }

      const char = await service.getCharacteristic(CHAR_TX_RX);
      await char.startNotifications();

      char.addEventListener("characteristicvaluechanged", (e) => {
        const val = e.target.value;
        if (val.byteLength >= 11 && val.getUint8(0) === 0xc0 && val.getUint8(1) === 0x55 && val.getUint8(3) === 0x06) {
          const meters = val.getFloat32(7, true);
          if (!isNaN(meters) && meters > 0.05 && meters < 150) {
            commitSegment(meters);
          }
        }
      });

      try {
        await char.writeValue(new Uint8Array([0xc0, 0x55, 0x02, 0x01, 0x00, 0x1a]));
      } catch (w) {}

      btnBLE.disabled = true;
      btnBLE.classList.add("pressed");
      btnBLE.innerText = "BLE CONECTADO";
      printCmd("GLM en línea. Ajuste el ángulo en pantalla y dispare el láser.");

    } catch (err) {
      printCmd("Error BLE: " + (err.message || err));
    }
  });

  // 5. Renderizado Gráfico Estilo AutoCAD R14
  function renderScene() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawGridR14();

    // Líneas Vectoriales R14
    ctx.lineWidth = 1.5;
    lines.forEach((l) => {
      const p1 = worldToScreen(l.x1, l.y1);
      const p2 = worldToScreen(l.x2, l.y2);

      ctx.strokeStyle = "#00ffff"; // Cyan R14
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();

      // Grip Nodes (Vértices estilo cuadrado R14)
      ctx.fillStyle = "#0000ff";
      ctx.fillRect(p1.x - 3, p1.y - 3, 6, 6);
      ctx.strokeStyle = "#ffffff";
      ctx.strokeRect(p1.x - 3, p1.y - 3, 6, 6);

      // Cota de texto
      const midX = (p1.x + p2.x) / 2;
      const midY = (p1.y + p2.y) / 2;
      ctx.fillStyle = "#ffff00";
      ctx.font = "11px 'Consolas', monospace";
      ctx.fillText(`${l.dist.toFixed(2)}m`, midX + 5, midY - 5);
    });

    const baseScr = worldToScreen(activeBasePoint.x, activeBasePoint.y);

    // Retículo, Puntero de Dibujo y Flecha Bloqueada
    drawCrosshairAndLockedArrow(baseScr.x, baseScr.y);

    drawUCSIcon();
  }

  function drawGridR14() {
    const step = viewScale;
    ctx.fillStyle = "#333333";
    const startX = viewOffset.x % step;
    const startY = viewOffset.y % step;

    // Retícula por puntos (Grid de AutoCAD R14)
    for (let x = startX; x < canvas.width; x += step) {
      for (let y = startY; y < canvas.height; y += step) {
        ctx.fillRect(x - 0.5, y - 0.5, 1.5, 1.5);
      }
    }
  }

  function drawCrosshairAndLockedArrow(cx, cy) {
    // 1. Crosshair infinito blanco
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy);
    ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height);
    ctx.stroke();

    // 2. Pickbox central (Cuadro del cursor)
    ctx.strokeStyle = "#ffffff";
    ctx.strokeRect(cx - 5, cy - 5, 10, 10);

    // 3. Dial Circular de Referencia (Transportador de Ángulos R14)
    ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, DIAL_RADIUS, 0, Math.PI * 2);
    ctx.stroke();

    // Marcas cardinales en el dial
    const cardinalAngles = [0, 90, 180, 270];
    cardinalAngles.forEach(deg => {
      const r = deg * Math.PI / 180;
      const rx1 = cx + (DIAL_RADIUS - 4) * Math.cos(r);
      const ry1 = cy - (DIAL_RADIUS - 4) * Math.sin(r);
      const rx2 = cx + (DIAL_RADIUS + 4) * Math.cos(r);
      const ry2 = cy - (DIAL_RADIUS + 4) * Math.sin(r);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
      ctx.beginPath();
      ctx.moveTo(rx1, ry1);
      ctx.lineTo(rx2, ry2);
      ctx.stroke();
    });

    // 4. FLECHA BLOQUEADA Y DESTACADA (Orientación Activa de Medición)
    const rad = lockedAngle * (Math.PI / 180);
    const arrowLen = DIAL_RADIUS + 15;
    const tx = cx + arrowLen * Math.cos(rad);
    const ty = cy - arrowLen * Math.sin(rad);

    // Línea de proyección continua destacada (Amarillo R14)
    ctx.strokeStyle = "#ffff00";
    ctx.lineWidth = 2.0;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(tx, ty);
    ctx.stroke();

    // Cabeza de la Flecha Bloqueada (Destacada en Rojo / Amarillo)
    const tipAngle = Math.atan2(cy - ty, tx - cx);
    const headAngleOffset = Math.PI / 6;

    ctx.fillStyle = isDraggingDial ? "#00ff00" : "#ff0000";
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.0;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(
      tx - ARROW_HEAD * Math.cos(tipAngle - headAngleOffset),
      ty + ARROW_HEAD * Math.sin(tipAngle - headAngleOffset)
    );
    ctx.lineTo(
      tx - (ARROW_HEAD * 0.6) * Math.cos(tipAngle),
      ty + (ARROW_HEAD * 0.6) * Math.sin(tipAngle)
    );
    ctx.lineTo(
      tx - ARROW_HEAD * Math.cos(tipAngle + headAngleOffset),
      ty + ARROW_HEAD * Math.sin(tipAngle + headAngleOffset)
    );
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Etiqueta de Ángulo Bloqueado
    ctx.fillStyle = "#ffff00";
    ctx.font = "bold 11px 'Consolas', monospace";
    ctx.fillText(`${lockedAngle.toFixed(0)}°`, tx + 10, ty + 4);

    // Indicador visual de modo arrastre activo
    if (isDraggingDial) {
      ctx.fillStyle = "rgba(0, 255, 0, 0.15)";
      ctx.beginPath();
      ctx.arc(cx, cy, DIAL_RADIUS + 20, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawUCSIcon() {
    const ox = 30;
    const oy = canvas.height - 30;
    const len = 25;

    ctx.lineWidth = 2;
    ctx.strokeStyle = "#ffffff";

    // Eje X
    ctx.beginPath();
    ctx.moveTo(ox, oy); ctx.lineTo(ox + len, oy);
    ctx.stroke();

    // Flecha X
    ctx.beginPath();
    ctx.moveTo(ox + len, oy); ctx.lineTo(ox + len - 4, oy - 3); ctx.lineTo(ox + len - 4, oy + 3);
    ctx.closePath();
    ctx.fillStyle = "#ffffff";
    ctx.fill();

    // Eje Y
    ctx.beginPath();
    ctx.moveTo(ox, oy); ctx.lineTo(ox, oy - len);
    ctx.stroke();

    // Flecha Y
    ctx.beginPath();
    ctx.moveTo(ox, oy - len); ctx.lineTo(ox - 3, oy - len + 4); ctx.lineTo(ox + 3, oy - len + 4);
    ctx.closePath();
    ctx.fill();

    // Texto UCS clásico
    ctx.font = "bold 10px 'Consolas', monospace";
    ctx.fillText("X", ox + len + 5, oy + 3);
    ctx.fillText("Y", ox - 3, oy - len - 5);
    ctx.fillText("W", ox + 4, oy - 4); // World Coordinate System
  }

  // Exportar DXF
  btnDxf.addEventListener("click", async () => {
    if (lines.length === 0) return;

    let dxf = "0\nSECTION\n2\nENTITIES\n";
    lines.forEach(l => {
      dxf += "0\nLINE\n8\n0\n"; // Layer 0 clásico R14
      dxf += `10\n${l.x1.toFixed(4)}\n20\n${l.y1.toFixed(4)}\n30\n0.0\n`;
      dxf += `11\n${l.x2.toFixed(4)}\n21\n${l.y2.toFixed(4)}\n31\n0.0\n`;
    });
    dxf += "0\nENDSEC\n0\nEOF\n";

    const fileName = `R14_DRAWING_${Date.now()}.dxf`;
    const blob = new Blob([dxf], { type: "application/dxf" });

    try {
      const file = new File([blob], fileName, { type: "application/dxf" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          files: [file],
          title: "AutoCAD R14 DXF",
          text: `Entidades: ${lines.length}`
        });
        printCmd("Archivo DXF transferido con éxito.");
        return;
      }
    } catch (e) {
      if (e.name === "AbortError") return;
    }

    const reader = new FileReader();
    reader.onload = function() {
      const link = document.createElement("a");
      link.href = reader.result;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      printCmd(`DXF generado: ${fileName}`);
    };
    reader.readAsDataURL(blob);
  });

  // Reset
  btnClear.addEventListener("click", () => {
    lines = [];
    redoStack = [];
    activeBasePoint = { x: 0, y: 0 };
    lockedAngle = 0;
    lastMeasuredDist = 0.0;
    isPickingOrigin = false;
    viewOffset = { x: canvas.width / 2, y: canvas.height / 2 };
    viewScale = 50.0;
    updateStatusPanels();
    printCmd("Dibujo nuevo inicializado.");
    renderScene();
  });

  updateStatusPanels();
</script>
</body>
</html>
