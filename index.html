<script>
  // UUIDs oficiales Bosch en minúsculas estrictas
  const SERVICE_GLM = "00005301-0000-0041-4c53-53494e535452";
  const CHAR_DATA   = "00004301-0000-0041-4c53-53494e535452";

  let currentHeading = 0;
  let orthoEnabled = false;
  let points = [{ x: 0, y: 0 }];

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const logDiv = document.getElementById("log");
  const lblHeading = document.getElementById("lblHeading");
  const lblSnapped = document.getElementById("lblSnapped");
  const lblDist = document.getElementById("lblDist");
  const lblPts = document.getElementById("lblPts");

  const btnSensors = document.getElementById("btnSensors");
  const btnBLE = document.getElementById("btnBLE");
  const btnOrtho = document.getElementById("btnOrtho");
  const btnDxf = document.getElementById("btnDxf");
  const btnClear = document.getElementById("btnClear");

  function log(msg) {
    if (logDiv) {
      logDiv.innerHTML += `<div>> ${msg}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }
  }

  function resize() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
    draw();
  }
  window.addEventListener("resize", resize);
  resize();

  // 1. Sensores iOS
  btnSensors.addEventListener("click", async () => {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      try {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res === "granted") {
          window.addEventListener("deviceorientation", handleOrientation, true);
          btnSensors.disabled = true;
          btnSensors.innerText = "Brújula OK";
        }
      } catch (err) {
        log("Error brújula: " + (err ? (err.message || err) : "desconocido"));
      }
    } else {
      window.addEventListener("deviceorientation", handleOrientation, true);
      btnSensors.disabled = true;
      btnSensors.innerText = "Brújula OK";
    }
  });

  function handleOrientation(e) {
    if (e.webkitCompassHeading !== undefined) {
      currentHeading = e.webkitCompassHeading;
    } else if (e.alpha !== null) {
      currentHeading = (360 - e.alpha) % 360;
    }

    let eff = currentHeading;
    if (orthoEnabled) {
      eff = Math.round(eff / 90) * 90 % 360;
    }

    lblHeading.innerText = currentHeading.toFixed(1);
    lblSnapped.innerText = eff.toFixed(0);
  }

  btnOrtho.addEventListener("click", () => {
    orthoEnabled = !orthoEnabled;
    btnOrtho.innerText = `ORTO: ${orthoEnabled ? "ON" : "OFF"}`;
    btnOrtho.classList.toggle("active", orthoEnabled);
  });

  // 2. Conexión BLE compatible con Bluefy
  btnBLE.addEventListener("click", async () => {
    try {
      log("Abriendo escáner BLE...");

      const device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: "GLM" }],
        optionalServices: [SERVICE_GLM]
      });

      log(`Dispositivo vinculado: ${device.name}`);
      log("Conectando al GATT...");

      const server = await device.gatt.connect();
      log("GATT conectado. Obteniendo servicio Bosch...");

      const service = await server.getPrimaryService(SERVICE_GLM);
      log("Servicio obtenido. Buscando característica...");

      const characteristic = await service.getCharacteristic(CHAR_DATA);
      log("Característica obtenida. Activando notificaciones...");

      await characteristic.startNotifications();
      characteristic.addEventListener("characteristicvaluechanged", (e) => {
        const val = e.target.value;
        if (val && val.byteLength >= 8) {
          const rawDist = val.getUint32(4, true);
          const meters = rawDist / 1000.0;
          if (meters > 0 && meters < 150) {
            processVector(meters);
          }
        }
      });

      // Secuencia de sincronización de reporte continuo Bosch
      try {
        await characteristic.writeValue(new Uint8Array([0xc0, 0x55, 0x02, 0x01, 0x00, 0x1a]));
      } catch (wErr) {
        // En algunos firmwares de GLM el write no es bloqueante
      }

      btnBLE.disabled = true;
      btnBLE.innerText = "GLM Conectado";
      btnBLE.classList.add("active");
      btnDxf.disabled = false;
      log("Listo. Realiza mediciones desde el botón del telémetro.");

    } catch (err) {
      const errTxt = (err && err.message) ? err.message : (err ? String(err) : "Conexión cancelada o rechazada");
      log(`Error BLE: ${errTxt}`);
    }
  });

  function processVector(distance) {
    lblDist.innerText = distance.toFixed(3);

    let angleDeg = currentHeading;
    if (orthoEnabled) {
      angleDeg = Math.round(angleDeg / 90) * 90 % 360;
    }

    const cartesianRad = (90 - angleDeg) * (Math.PI / 180);
    const dx = distance * Math.cos(cartesianRad);
    const dy = distance * Math.sin(cartesianRad);

    const last = points[points.length - 1];
    const next = { x: last.x + dx, y: last.y + dy };
    points.push(next);

    if (lblPts) lblPts.innerText = points.length;
    log(`Punto #${points.length}: ${distance.toFixed(3)}m @ ${angleDeg.toFixed(0)}°`);

    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (points.length < 2) return;

    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    points.forEach(p => {
      minX = Math.min(minX, p.x);
      maxX = Math.max(maxX, p.x);
      minY = Math.min(minY, p.y);
      maxY = Math.max(maxY, p.y);
    });

    const spanX = Math.max(maxX - minX, 0.5);
    const spanY = Math.max(maxY - minY, 0.5);
    const pad = 35;

    const scale = Math.min(
      (canvas.width - pad * 2) / spanX,
      (canvas.height - pad * 2) / spanY
    );

    const toScreen = (p) => ({
      x: pad + (p.x - minX) * scale,
      y: canvas.height - (pad + (p.y - minY) * scale)
    });

    ctx.beginPath();
    ctx.strokeStyle = "#30d158";
    ctx.lineWidth = 2.5;
    const p0 = toScreen(points[0]);
    ctx.moveTo(p0.x, p0.y);

    for (let i = 1; i < points.length; i++) {
      const pi = toScreen(points[i]);
      ctx.lineTo(pi.x, pi.y);
    }
    ctx.stroke();

    points.forEach((p, idx) => {
      const pi = toScreen(p);
      ctx.fillStyle = idx === points.length - 1 ? "#ff453a" : "#ffffff";
      ctx.beginPath();
      ctx.arc(pi.x, pi.y, 4, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  btnDxf.addEventListener("click", () => {
    if (points.length < 2) return;

    let dxf = "0\nSECTION\n2\nENTITIES\n";
    for (let i = 0; i < points.length - 1; i++) {
      const a = points[i];
      const b = points[i + 1];
      dxf += "0\nLINE\n8\nLEVANTAMIENTO\n";
      dxf += `10\n${a.x.toFixed(4)}\n20\n${a.y.toFixed(4)}\n30\n0.0\n`;
      dxf += `11\n${b.x.toFixed(4)}\n21\n${b.y.toFixed(4)}\n31\n0.0\n`;
    }
    dxf += "0\nENDSEC\n0\nEOF\n";

    const blob = new Blob([dxf], { type: "application/dxf" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `levantamiento_${Date.now()}.dxf`;
    link.click();
    URL.revokeObjectURL(url);
    log("DXF descargado.");
  });

  btnClear.addEventListener("click", () => {
    points = [{ x: 0, y: 0 }];
    if (lblPts) lblPts.innerText = "1";
    lblDist.innerText = "0.000";
    log("Trazado reiniciado.");
    draw();
  });
</script>
