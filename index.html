<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GLM CAD Mobile Pro</title>
  <style>
    :root {
      --bg-dark: #121214;
      --panel-bg: #1a1a1e;
      --border-color: #2c2c34;
      --accent: #00ffff;
      --accent-yellow: #ffd60a;
      --accent-green: #30d158;
      --accent-red: #ff453a;
      --text-main: #f4f4f5;
      --text-muted: #8e8e93;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }
    body { 
      background: var(--bg-dark); 
      color: var(--text-main); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
    }

    /* 1. BARRA SUPERIOR: ESTADO Y SALIDA */
    #top-bar {
      height: 48px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      z-index: 20;
    }

    .top-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-top {
      background: #27272a;
      color: var(--text-main);
      border: 1px solid #3f3f46;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-top:active { background: #3f3f46; }
    .btn-top.active { background: #164e63; border-color: var(--accent); color: var(--accent); }
    .btn-top.connected { background: #14532d; border-color: var(--accent-green); color: var(--accent-green); }
    .btn-top.dxf { background: #1e3a8a; border-color: #3b82f6; color: #fff; }

    .led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-red);
    }
    .led.on { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }

    /* 2. VIEWPORT CENTRAL */
    #viewport-container {
      flex: 1;
      position: relative;
      background: #09090b;
      touch-action: none;
      overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }

    /* Chips flotantes en el Viewport */
    #chip-ortho {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(24, 24, 27, 0.85);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(4px);
      z-index: 10;
      touch-action: manipulation;
    }
    #chip-ortho.active {
      background: rgba(14, 165, 233, 0.2);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    #mode-toast {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(24, 24, 27, 0.8);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.70rem;
      pointer-events: none;
      z-index: 10;
    }

    /* 3. HUD DE TELEMETRÍA */
    #telemetry-hud {
      height: 30px;
      background: #141416;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-family: 'Consolas', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      padding: 0 8px;
    }
    .hud-val { color: var(--accent-yellow); font-weight: bold; }

    /* 4. BARRA DE ACCIÓN INFERIOR (DOCK) */
    #action-dock {
      height: 56px;
      background: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 6px;
      gap: 5px;
      z-index: 20;
    }

    .btn-dock {
      flex: 1;
      height: 40px;
      background: #242429;
      color: var(--text-main);
      border: 1px solid #383842;
      border-radius: 6px;
      font-size: 0.70rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-dock:active { background: #383842; }
    .btn-dock:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-dock.warn { border-color: #ca8a04; color: var(--accent-yellow); }
    .btn-dock.action-close { background: #7f1d1d; border-color: var(--accent-red); color: #fff; }
    .btn-dock.pressed { background: #0284c7; border-color: #38bdf8; color: #fff; }
  </style>
</head>
<body>

<!-- 1. Barra de Control Superior -->
<div id="top-bar">
  <div class="top-group">
    <button id="btnBLE" class="btn-top">
      <span id="bleLed" class="led"></span>
      <span id="bleText">CONECTAR GLM</span>
    </button>
    <button id="btnCompass" class="btn-top">BRÚJULA</button>
  </div>
  <div class="top-group">
    <button id="btnFullscreen" class="btn-top" title="Pantalla Completa">⛶</button>
    <button id="btnExtents" class="btn-top" title="Centrar Dibujo">CENTRAR</button>
    <button id="btnDxf" class="btn-top dxf" disabled>DXF</button>
  </div>
</div>

<!-- 2. Viewport CAD -->
<div id="viewport-container">
  <div id="mode-toast">ESTADO: INICIALIZADO</div>
  <div id="chip-ortho" class="active">ORTO: ON</div>
  <canvas id="cadCanvas"></canvas>
</div>

<!-- 3. Franja de Telemetría (HUD) -->
<div id="telemetry-hud">
  <span>PTO: <span id="hudCoords" class="hud-val">0.000, 0.000</span></span>
  <span>DIST: <span id="hudDist" class="hud-val">0.000m</span></span>
  <span>RUMBO: <span id="hudAngle" class="hud-val">090°</span></span>
  <span>LÍNEAS: <span id="hudLines" class="hud-val">0</span></span>
</div>

<!-- 4. Dock Inferior de Dibujo -->
<div id="action-dock">
  <button id="btnUndo" class="btn-dock warn" disabled>
    <span>↶</span>
    <span>DESHACER</span>
  </button>
  <button id="btnAngle" class="btn-dock">
    <span>∠</span>
    <span>ÁNGULO</span>
  </button>
  <button id="btnManualDist" class="btn-dock">
    <span>📏</span>
    <span>DIST MAN</span>
  </button>
  <button id="btnSetBase" class="btn-dock">
    <span>📍</span>
    <span>NUEVO PTO</span>
  </button>
  <button id="btnClose" class="btn-dock action-close">
    <span>⏹</span>
    <span>CERRAR</span>
  </button>
</div>

<script>
  const SERVICE_DATA = "02A6C0D0-0451-4000-B000-FB3210111989";
  const CHAR_TX_RX   = "02A6C0D1-0451-4000-B000-FB3210111989";

  let lines = [];
  let redoStack = [];
  let activeBasePoint = { x: 0, y: 0 };
  let lockedAngle = 90; // Ángulo por defecto hacia arriba (90° Norte)
  let currentCompassHeading = 0;
  let orthoEnabled = true;
  let isPickingOrigin = false;
  let isDraggingDial = false;
  let lastMeasuredDist = 0.0;

  // Viewport / Escala y Pan
  let viewOffset = { x: 0, y: 0 };
  let viewScale = 50.0;
  const INITIAL_SCALE = 50.0;

  const DIAL_RADIUS = 55;
  const ARROW_HEAD = 12;

  const canvas = document.getElementById("cadCanvas");
  const ctx = canvas.getContext("2d");

  const hudCoords = document.getElementById("hudCoords");
  const hudDist = document.getElementById("hudDist");
  const hudAngle = document.getElementById("hudAngle");
  const hudLines = document.getElementById("hudLines");
  const modeToast = document.getElementById("mode-toast");
  const chipOrtho = document.getElementById("chip-ortho");
  const bleLed = document.getElementById("bleLed");
  const bleText = document.getElementById("bleText");

  const btnBLE = document.getElementById("btnBLE");
  const btnCompass = document.getElementById("btnCompass");
  const btnFullscreen = document.getElementById("btnFullscreen");
  const btnExtents = document.getElementById("btnExtents");
  const btnDxf = document.getElementById("btnDxf");
  const btnUndo = document.getElementById("btnUndo");
  const btnAngle = document.getElementById("btnAngle");
  const btnManualDist = document.getElementById("btnManualDist");
  const btnSetBase = document.getElementById("btnSetBase");
  const btnClose = document.getElementById("btnClose");

  function resizeViewport() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
    if (lines.length === 0 && activeBasePoint.x === 0 && activeBasePoint.y === 0) {
      viewOffset.x = canvas.width / 2;
      viewOffset.y = canvas.height / 2;
    }
    renderScene();
  }
  window.addEventListener("resize", resizeViewport);
  resizeViewport();

  function updateHUD() {
    hudCoords.innerText = `${activeBasePoint.x.toFixed(2)}, ${activeBasePoint.y.toFixed(2)}`;
    hudDist.innerText = `${lastMeasuredDist.toFixed(3)}m`;
    hudAngle.innerText = `${lockedAngle.toFixed(0).padStart(3, '0')}°`;
    hudLines.innerText = lines.length;
    btnUndo.disabled = lines.length === 0;
    btnDxf.disabled = lines.length === 0;
  }

  function worldToScreen(wx, wy) {
    return {
      x: viewOffset.x + wx * viewScale,
      y: viewOffset.y - wy * viewScale
    };
  }

  function screenToWorld(sx, sy) {
    return {
      x: (sx - viewOffset.x) / viewScale,
      y: -(sy - viewOffset.y) / viewScale
    };
  }

  // Alternar ORTO
  chipOrtho.addEventListener("click", () => {
    orthoEnabled = !orthoEnabled;
    chipOrtho.classList.toggle("active", orthoEnabled);
    chipOrtho.innerText = `ORTO: ${orthoEnabled ? "ON" : "OFF"}`;
    if (orthoEnabled) {
      lockedAngle = Math.round(lockedAngle / 90) * 90 % 360;
      if (lockedAngle < 0) lockedAngle += 360;
    }
    updateHUD();
    renderScene();
  });

  // Brújula
  btnCompass.addEventListener("click", async () => {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      try {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res === "granted") {
          window.addEventListener("deviceorientation", (e) => {
            if (e.webkitCompassHeading !== undefined) {
              currentCompassHeading = e.webkitCompassHeading;
            } else if (e.alpha !== null) {
              currentCompassHeading = (360 - e.alpha) % 360;
            }
          }, true);
          btnCompass.disabled = true;
          btnCompass.classList.add("active");
          modeToast.innerText = "BRÚJULA ENLAZADA";
        }
      } catch (err) {
        modeToast.innerText = "ERROR EN BRÚJULA";
      }
    } else {
      btnCompass.disabled = true;
      btnCompass.classList.add("active");
      modeToast.innerText = "BRÚJULA ENLAZADA";
    }
  });

  // Pantalla Completa
  btnFullscreen.addEventListener("click", () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
    }
  });

  // Zoom Extents / Centrar
  function zoomExtents() {
    if (lines.length === 0) {
      viewOffset.x = canvas.width / 2;
      viewOffset.y = canvas.height / 2;
      viewScale = INITIAL_SCALE;
      renderScene();
      return;
    }

    let minX = activeBasePoint.x, maxX = activeBasePoint.x;
    let minY = activeBasePoint.y, maxY = activeBasePoint.y;

    lines.forEach(l => {
      minX = Math.min(minX, l.x1, l.x2);
      maxX = Math.max(maxX, l.x1, l.x2);
      minY = Math.min(minY, l.y1, l.y2);
      maxY = Math.max(maxY, l.y1, l.y2);
    });

    const spanX = Math.max(maxX - minX, 1.0);
    const spanY = Math.max(maxY - minY, 1.0);
    const pad = 70;

    viewScale = Math.min(
      (canvas.width - pad * 2) / spanX,
      (canvas.height - pad * 2) / spanY
    );
    viewScale = Math.max(8, Math.min(viewScale, 250));

    viewOffset.x = canvas.width / 2 - ((minX + maxX) / 2) * viewScale;
    viewOffset.y = canvas.height / 2 + ((minY + maxY) / 2) * viewScale;

    renderScene();
    modeToast.innerText = "VISTA CENTRADA";
  }
  btnExtents.addEventListener("click", zoomExtents);

  // Deshacer [U]
  btnUndo.addEventListener("click", () => {
    if (lines.length === 0) return;
    const removed = lines.pop();
    redoStack.push(removed);
    activeBasePoint = { x: removed.x1, y: removed.y1 };
    updateHUD();
    modeToast.innerText = `DESHECHO: ${removed.dist.toFixed(2)}m`;
    renderScene();
  });

  // Configurar Ángulo Manual
  btnAngle.addEventListener("click", () => {
    const input = prompt("Ángulo cartesiano (0=Este, 90=Norte, 180=Oeste, 270=Sur):", lockedAngle);
    if (input !== null) {
      let deg = parseFloat(input);
      if (!isNaN(deg)) {
        deg = (deg % 360 + 360) % 360;
        if (orthoEnabled) deg = Math.round(deg / 90) * 90 % 360;
        lockedAngle = deg;
        updateHUD();
        renderScene();
      }
    }
  });

  // Distancia Manual
  btnManualDist.addEventListener("click", () => {
    const input = prompt("Ingrese longitud en metros:", lastMeasuredDist > 0 ? lastMeasuredDist.toFixed(3) : "");
    if (input !== null) {
      const d = parseFloat(input.replace(",", "."));
      if (!isNaN(d) && d > 0) {
        commitSegment(d);
      }
    }
  });

  // Reposicionar Punto Base (Pick Point)
  btnSetBase.addEventListener("click", () => {
    isPickingOrigin = !isPickingOrigin;
    btnSetBase.classList.toggle("pressed", isPickingOrigin);
    modeToast.innerText = isPickingOrigin ? "PULSE NUEVA POSICIÓN" : "MODO ACTIVO";
  });

  // Cerrar Polígono
  btnClose.addEventListener("click", () => {
    if (lines.length < 2) {
      modeToast.innerText = "REQUIERE >= 2 LÍNEAS";
      return;
    }
    const origin = { x: lines[0].x1, y: lines[0].y1 };
    const d = Math.hypot(origin.x - activeBasePoint.x, origin.y - activeBasePoint.y);
    if (d > 0.001) {
      redoStack = [];
      const ang = (Math.atan2(origin.y - activeBasePoint.y, origin.x - activeBasePoint.x) * 180 / Math.PI + 360) % 360;
      lines.push({
        x1: activeBasePoint.x,
        y1: activeBasePoint.y,
        x2: origin.x,
        y2: origin.y,
        dist: d,
        angle: ang
      });
      activeBasePoint = { x: origin.x, y: origin.y };
      updateHUD();
      modeToast.innerText = "POLÍGONO CERRADO";
      renderScene();
    }
  });

  // GESTOS TÁCTILES: Pinch-Zoom, Pan y Dial de Ángulo
  let initialPinchDist = 0;
  let initialScale = 50.0;
  let pinchCenterWorld = { x: 0, y: 0 };
  let touchStart1 = { x: 0, y: 0 };
  let touchStart2 = { x: 0, y: 0 };
  let isMultiTouch = false;

  canvas.addEventListener("touchstart", (e) => {
    const rect = canvas.getBoundingClientRect();

    if (e.touches.length === 2) {
      isMultiTouch = true;
      isDraggingDial = false;

      const t1 = e.touches[0];
      const t2 = e.touches[1];

      touchStart1 = { x: t1.clientX - rect.left, y: t1.clientY - rect.top };
      touchStart2 = { x: t2.clientX - rect.left, y: t2.clientY - rect.top };

      initialPinchDist = Math.hypot(touchStart1.x - touchStart2.x, touchStart1.y - touchStart2.y);
      initialScale = viewScale;

      const midScr = { x: (touchStart1.x + touchStart2.x) / 2, y: (touchStart1.y + touchStart2.y) / 2 };
      pinchCenterWorld = screenToWorld(midScr.x, midScr.y);

    } else if (e.touches.length === 1) {
      isMultiTouch = false;
      const t = e.touches[0];
      const sx = t.clientX - rect.left;
      const sy = t.clientY - rect.top;
      touchStart1 = { x: sx, y: sy };

      const baseScr = worldToScreen(activeBasePoint.x, activeBasePoint.y);
      const distToDial = Math.hypot(sx - baseScr.x, sy - baseScr.y);

      if (!isPickingOrigin && distToDial <= DIAL_RADIUS + 25) {
        isDraggingDial = true;
        updateAngleFromPointer(sx, sy, baseScr);
      }
    }
  }, { passive: false });

  canvas.addEventListener("touchmove", (e) => {
    const rect = canvas.getBoundingClientRect();

    if (e.touches.length === 2) {
      e.preventDefault();
      const t1 = e.touches[0];
      const t2 = e.touches[1];

      const p1 = { x: t1.clientX - rect.left, y: t1.clientY - rect.top };
      const p2 = { x: t2.clientX - rect.left, y: t2.clientY - rect.top };

      const currentDist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
      if (initialPinchDist > 5) {
        const factor = currentDist / initialPinchDist;
        viewScale = Math.max(5, Math.min(initialScale * factor, 300));

        const midScr = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
        viewOffset.x = midScr.x - pinchCenterWorld.x * viewScale;
        viewOffset.y = midScr.y + pinchCenterWorld.y * viewScale;

        renderScene();
      }

    } else if (e.touches.length === 1) {
      const t = e.touches[0];
      const sx = t.clientX - rect.left;
      const sy = t.clientY - rect.top;
      const baseScr = worldToScreen(activeBasePoint.x, activeBasePoint.y);

      if (isDraggingDial) {
        e.preventDefault();
        updateAngleFromPointer(sx, sy, baseScr);
      } else if (!isPickingOrigin) {
        const dx = sx - touchStart1.x;
        const dy = sy - touchStart1.y;
        if (Math.hypot(dx, dy) > 3) {
          viewOffset.x += dx;
          viewOffset.y += dy;
          touchStart1 = { x: sx, y: sy };
          renderScene();
        }
      }
    }
  }, { passive: false });

  canvas.addEventListener("touchend", (e) => {
    if (isDraggingDial) {
      isDraggingDial = false;
      modeToast.innerText = `RUMBO: ${lockedAngle.toFixed(0)}°`;
    } else if (isPickingOrigin && e.touches.length === 0) {
      const w = screenToWorld(touchStart1.x, touchStart1.y);
      activeBasePoint = { x: w.x, y: w.y };
      isPickingOrigin = false;
      btnSetBase.classList.remove("pressed");
      updateHUD();
      modeToast.innerText = "PTO BASE DEFINIDO";
      renderScene();
    }
    if (e.touches.length === 0) isMultiTouch = false;
  });

  function updateAngleFromPointer(sx, sy, baseScr) {
    const dx = sx - baseScr.x;
    const dy = baseScr.y - sy;
    let deg = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;

    if (orthoEnabled) {
      deg = Math.round(deg / 90) * 90 % 360;
    }
    lockedAngle = deg;
    updateHUD();
    renderScene();
  }

  // Trazado
  function commitSegment(dist) {
    lastMeasuredDist = dist;
    redoStack = [];

    const rad = lockedAngle * (Math.PI / 180);
    const tx = activeBasePoint.x + dist * Math.cos(rad);
    const ty = activeBasePoint.y + dist * Math.sin(rad);

    lines.push({
      x1: activeBasePoint.x,
      y1: activeBasePoint.y,
      x2: tx,
      y2: ty,
      dist: dist,
      angle: lockedAngle
    });

    activeBasePoint = { x: tx, y: ty };
    updateHUD();
    modeToast.innerText = `+${dist.toFixed(3)}m @ ${lockedAngle.toFixed(0)}°`;
    renderScene();
  }

  // BLE Bosch GLM 120 C
  btnBLE.addEventListener("click", async () => {
    try {
      modeToast.innerText = "BUSCANDO GLM...";
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERVICE_DATA, SERVICE_DATA.toLowerCase()]
      });

      const server = await device.gatt.connect();

      let service;
      try {
        service = await server.getPrimaryService(SERVICE_DATA);
      } catch (e) {
        service = await server.getPrimaryService(SERVICE_DATA.toLowerCase());
      }

      const char = await service.getCharacteristic(CHAR_TX_RX);
      await char.startNotifications();

      char.addEventListener("characteristicvaluechanged", (e) => {
        const val = e.target.value;
        if (val.byteLength >= 11 && val.getUint8(0) === 0xc0 && val.getUint8(1) === 0x55 && val.getUint8(3) === 0x06) {
          const meters = val.getFloat32(7, true);
          if (!isNaN(meters) && meters > 0.05 && meters < 150) {
            commitSegment(meters);
          }
        }
      });

      try {
        await char.writeValue(new Uint8Array([0xc0, 0x55, 0x02, 0x01, 0x00, 0x1a]));
      } catch (w) {}

      bleLed.classList.add("on");
      bleText.innerText = "GLM ACTIVO";
      btnBLE.classList.add("connected");
      modeToast.innerText = "CONEXIÓN EXITOSA";

    } catch (err) {
      modeToast.innerText = "FALLA BLE";
    }
  });

  // Renderizado Viewport
  function renderScene() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawGrid();

    // Líneas
    lines.forEach((l) => {
      const p1 = worldToScreen(l.x1, l.y1);
      const p2 = worldToScreen(l.x2, l.y2);

      ctx.strokeStyle = "#00ffff";
      ctx.lineWidth = 2.0;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(p1.x - 2.5, p1.y - 2.5, 5, 5);

      const midX = (p1.x + p2.x) / 2;
      const midY = (p1.y + p2.y) / 2;
      ctx.fillStyle = "#ffd60a";
      ctx.font = "bold 11px monospace";
      ctx.fillText(`${l.dist.toFixed(2)}m`, midX + 6, midY - 6);
    });

    const baseScr = worldToScreen(activeBasePoint.x, activeBasePoint.y);
    drawCrosshairAndDial(baseScr.x, baseScr.y);
    drawUCS();
  }

  function drawGrid() {
    const step = viewScale;
    ctx.fillStyle = "#27272a";
    const startX = viewOffset.x % step;
    const startY = viewOffset.y % step;

    for (let x = startX; x < canvas.width; x += step) {
      for (let y = startY; y < canvas.height; y += step) {
        ctx.fillRect(x - 0.5, y - 0.5, 1.5, 1.5);
      }
    }
  }

  function drawCrosshairAndDial(cx, cy) {
    ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy);
    ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height);
    ctx.stroke();

    ctx.strokeStyle = "#ffffff";
    ctx.strokeRect(cx - 5, cy - 5, 10, 10);

    // Dial transportador tenue
    ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, DIAL_RADIUS, 0, Math.PI * 2);
    ctx.stroke();

    // Flecha destacada de orientación bloqueada
    const rad = lockedAngle * (Math.PI / 180);
    const arrowLen = DIAL_RADIUS + 14;
    const tx = cx + arrowLen * Math.cos(rad);
    const ty = cy - arrowLen * Math.sin(rad);

    ctx.strokeStyle = isDraggingDial ? "#30d158" : "#ffd60a";
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(tx, ty);
    ctx.stroke();

    const tipAngle = Math.atan2(cy - ty, tx - cx);
    const headAngleOffset = Math.PI / 6;

    ctx.fillStyle = isDraggingDial ? "#30d158" : "#ff453a";
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - ARROW_HEAD * Math.cos(tipAngle - headAngleOffset), ty + ARROW_HEAD * Math.sin(tipAngle - headAngleOffset));
    ctx.lineTo(tx - (ARROW_HEAD * 0.6) * Math.cos(tipAngle), ty + (ARROW_HEAD * 0.6) * Math.sin(tipAngle));
    ctx.lineTo(tx - ARROW_HEAD * Math.cos(tipAngle + headAngleOffset), ty + ARROW_HEAD * Math.sin(tipAngle + headAngleOffset));
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#ffd60a";
    ctx.font = "bold 10px monospace";
    ctx.fillText(`${lockedAngle.toFixed(0)}°`, tx + 8, ty + 3);
  }

  function drawUCS() {
    const ox = 25;
    const oy = canvas.height - 25;
    const len = 20;

    ctx.lineWidth = 1.8;
    ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";

    ctx.beginPath();
    ctx.moveTo(ox, oy); ctx.lineTo(ox + len, oy);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(ox, oy); ctx.lineTo(ox, oy - len);
    ctx.stroke();

    ctx.font = "bold 9px monospace";
    ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
    ctx.fillText("X", ox + len + 3, oy + 3);
    ctx.fillText("Y", ox - 3, oy - len - 3);
  }

  // Exportar DXF (MUROS + COTAS)
  btnDxf.addEventListener("click", async () => {
    if (lines.length === 0) return;

    let dxf = "0\nSECTION\n2\nHEADER\n9\n$ACADVER\n1\nAC1014\n0\nENDSEC\n";
    dxf += "0\nSECTION\n2\nTABLES\n0\nTABLE\n2\nLAYER\n70\n2\n";
    dxf += "0\nLAYER\n2\nMUROS\n70\n0\n62\n4\n6\nCONTINUOUS\n";
    dxf += "0\nLAYER\n2\nCOTAS\n70\n0\n62\n2\n6\nCONTINUOUS\n";
    dxf += "0\nENDTAB\n0\nENDSEC\n";
    dxf += "0\nSECTION\n2\nENTITIES\n";

    lines.forEach(l => {
      dxf += "0\nLINE\n8\nMUROS\n";
      dxf += `10\n${l.x1.toFixed(4)}\n20\n${l.y1.toFixed(4)}\n30\n0.0\n`;
      dxf += `11\n${l.x2.toFixed(4)}\n21\n${l.y2.toFixed(4)}\n31\n0.0\n`;

      const midX = (l.x1 + l.x2) / 2;
      const midY = (l.y1 + l.y2) / 2;
      const angleRad = (l.angle * Math.PI) / 180;
      const perpX = -Math.sin(angleRad) * 0.20;
      const perpY = Math.cos(angleRad) * 0.20;

      dxf += "0\nTEXT\n8\nCOTAS\n";
      dxf += `10\n${(midX + perpX).toFixed(4)}\n20\n${(midY + perpY).toFixed(4)}\n30\n0.0\n`;
      dxf += "40\n0.18\n";
      dxf += `1\n${l.dist.toFixed(2)}m\n`;
      dxf += `50\n${l.angle.toFixed(1)}\n`;
      dxf += "72\n1\n";
      dxf += `11\n${(midX + perpX).toFixed(4)}\n21\n${(midY + perpY).toFixed(4)}\n31\n0.0\n`;
    });

    dxf += "0\nENDSEC\n0\nEOF\n";

    const fileName = `PLANO_${Date.now()}.dxf`;
    const blob = new Blob([dxf], { type: "application/dxf" });

    try {
      const file = new File([blob], fileName, { type: "application/dxf" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          files: [file],
          title: "Levantamiento DXF",
          text: `Poligonal con cotas: ${lines.length} muros.`
        });
        modeToast.innerText = "DXF EXPORTADO";
        return;
      }
    } catch (e) {
      if (e.name === "AbortError") return;
    }

    const reader = new FileReader();
    reader.onload = function() {
      const link = document.createElement("a");
      link.href = reader.result;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      modeToast.innerText = "DXF DESCARGADO";
    };
    reader.readAsDataURL(blob);
  });

  updateHUD();
</script>
