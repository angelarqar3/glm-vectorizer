<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GLM 120 C - Vectorizador</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, monospace; }
    body { background: #111; color: #eee; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { padding: 8px; background: #1c1c1e; display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid #333; }
    button { background: #007aff; color: #fff; border: none; padding: 8px 10px; border-radius: 6px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
    button.active { background: #34c759; }
    button:disabled { background: #2c2c2e; color: #666; }
    #telemetry { display: flex; justify-content: space-around; background: #000; padding: 6px; font-size: 0.75rem; color: #30d158; border-bottom: 1px solid #222; }
    #canvas-box { flex: 1; position: relative; }
    canvas { width: 100%; height: 100%; display: block; }
    #log { height: 90px; overflow-y: auto; background: #181818; padding: 6px; font-size: 0.7rem; border-top: 1px solid #333; }
  </style>
</head>
<body>

<header>
  <button id="btnSensors">1. Activar Brújula</button>
  <button id="btnBLE">2. Conectar GLM</button>
  <button id="btnOrtho">ORTO: OFF</button>
  <button id="btnDxf" disabled>Exportar DXF</button>
  <button id="btnClear">Reset</button>
</header>

<div id="telemetry">
  <span>Rumbo Real: <b id="lblHeading">--</b>°</span>
  <span>Rumbo Trazo: <b id="lblSnapped">--</b>°</span>
  <span>Última Dist.: <b id="lblDist">0.000</b> m</span>
</div>

<div id="canvas-box">
  <canvas id="stage"></canvas>
</div>

<div id="log">Esperando inicialización...</div>

<script>
  const SERVICE_UUID = "00000001-0000-1000-8000-00805f9b34fb";
  const CHAR_UUID    = "00000001-0000-1000-8000-00805f9b34fb";

  let currentHeading = 0;
  let orthoEnabled = false;
  let points = [{ x: 0, y: 0 }];

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const logDiv = document.getElementById("log");
  const lblHeading = document.getElementById("lblHeading");
  const lblSnapped = document.getElementById("lblSnapped");
  const lblDist = document.getElementById("lblDist");

  const btnSensors = document.getElementById("btnSensors");
  const btnBLE = document.getElementById("btnBLE");
  const btnOrtho = document.getElementById("btnOrtho");
  const btnDxf = document.getElementById("btnDxf");
  const btnClear = document.getElementById("btnClear");

  function resize() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
    draw();
  }
  window.addEventListener("resize", resize);
  resize();

  // 1. Sensores iOS (DeviceOrientation)
  btnSensors.addEventListener("click", async () => {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      try {
        const response = await DeviceOrientationEvent.requestPermission();
        if (response === "granted") {
          window.addEventListener("deviceorientation", handleOrientation, true);
          btnSensors.disabled = true;
          btnSensors.innerText = "Brújula OK";
        }
      } catch (err) {
        logDiv.innerText = "Error sensor: " + err.message;
      }
    } else {
      window.addEventListener("deviceorientation", handleOrientation, true);
      btnSensors.disabled = true;
    }
  });

  function handleOrientation(e) {
    if (e.webkitCompassHeading !== undefined) {
      currentHeading = e.webkitCompassHeading;
    } else if (e.alpha !== null) {
      currentHeading = (360 - e.alpha) % 360;
    }
    
    let effective = currentHeading;
    if (orthoEnabled) {
      effective = Math.round(effective / 90) * 90 % 360;
    }

    lblHeading.innerText = currentHeading.toFixed(1);
    lblSnapped.innerText = effective.toFixed(0);
  }

  // Modo Ortogonal Forzado
  btnOrtho.addEventListener("click", () => {
    orthoEnabled = !orthoEnabled;
    btnOrtho.innerText = `ORTO: ${orthoEnabled ? "ON" : "OFF"}`;
    btnOrtho.classList.toggle("active", orthoEnabled);
  });

  // 2. Conexión BLE (GLM 120 C)
  btnBLE.addEventListener("click", async () => {
    if (!navigator.bluetooth) {
      logDiv.innerText = "Web Bluetooth no soportado. Usa Bluefy en iOS.";
      return;
    }

    try {
      logDiv.innerText = "Buscando GLM 120 C...";
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERVICE_UUID]
      });

      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      const char = await service.getCharacteristic(CHAR_UUID);

      await char.startNotifications();
      char.addEventListener("characteristicvaluechanged", (e) => {
        const val = e.target.value;
        if (val.byteLength >= 8) {
          const rawDist = val.getUint32(4, true);
          const meters = rawDist / 1000.0;
          if (meters > 0 && meters < 150) {
            processVector(meters);
          }
        }
      });

      // Comando de suscripción de telemetría Bosch
      await char.writeValue(new Uint8Array([0xc0, 0x55, 0x02, 0x01, 0x00, 0x1a]));

      btnBLE.disabled = true;
      btnBLE.innerText = "GLM Conectado";
      btnDxf.disabled = false;
      logDiv.innerText = "GLM 120 C listo. Dispara una medición.";
    } catch (err) {
      logDiv.innerText = "Error BLE: " + err.message;
    }
  });

  // Cálculo vectorial y trazado
  function processVector(distance) {
    lblDist.innerText = distance.toFixed(3);

    let angleDeg = currentHeading;
    if (orthoEnabled) {
      angleDeg = Math.round(angleDeg / 90) * 90 % 360;
    }

    // Conversión de Azimut (0° Norte, horario) a Radián Cartesiano (0° Este, antihorario)
    const cartesianRad = (90 - angleDeg) * (Math.PI / 180);

    const dx = distance * Math.cos(cartesianRad);
    const dy = distance * Math.sin(cartesianRad);

    const last = points[points.length - 1];
    const next = { x: last.x + dx, y: last.y + dy };
    points.push(next);

    logDiv.innerHTML += `<div>V: ${distance.toFixed(3)}m @ ${angleDeg}° -> (${next.x.toFixed(2)}, ${next.y.toFixed(2)})</div>`;
    logDiv.scrollTop = logDiv.scrollHeight;

    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (points.length < 2) return;

    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    points.forEach(p => {
      minX = Math.min(minX, p.x);
      maxX = Math.max(maxX, p.x);
      minY = Math.min(minY, p.y);
      maxY = Math.max(maxY, p.y);
    });

    const spanX = Math.max(maxX - minX, 0.5);
    const spanY = Math.max(maxY - minY, 0.5);
    const pad = 30;

    const scale = Math.min(
      (canvas.width - pad * 2) / spanX,
      (canvas.height - pad * 2) / spanY
    );

    const toScreen = (p) => ({
      x: pad + (p.x - minX) * scale,
      y: canvas.height - (pad + (p.y - minY) * scale)
    });

    ctx.beginPath();
    ctx.strokeStyle = "#30d158";
    ctx.lineWidth = 2;
    const p0 = toScreen(points[0]);
    ctx.moveTo(p0.x, p0.y);

    for (let i = 1; i < points.length; i++) {
      const pi = toScreen(points[i]);
      ctx.lineTo(pi.x, pi.y);
    }
    ctx.stroke();

    points.forEach((p, idx) => {
      const pi = toScreen(p);
      ctx.fillStyle = idx === points.length - 1 ? "#ff453a" : "#ffffff";
      ctx.beginPath();
      ctx.arc(pi.x, pi.y, 4, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  // Exportación DXF R12
  btnDxf.addEventListener("click", () => {
    if (points.length < 2) return;

    let dxf = "0\nSECTION\n2\nENTITIES\n";
    for (let i = 0; i < points.length - 1; i++) {
      const a = points[i];
      const b = points[i + 1];
      dxf += "0\nLINE\n8\nLEVANTAMIENTO\n";
      dxf += `10\n${a.x.toFixed(4)}\n20\n${a.y.toFixed(4)}\n30\n0.0\n`;
      dxf += `11\n${b.x.toFixed(4)}\n21\n${b.y.toFixed(4)}\n31\n0.0\n`;
    }
    dxf += "0\nENDSEC\n0\nEOF\n";

    const blob = new Blob([dxf], { type: "application/dxf" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `levantamiento_${Date.now()}.dxf`;
    link.click();
    URL.revokeObjectURL(url);
  });

  btnClear.addEventListener("click", () => {
    points = [{ x: 0, y: 0 }];
    logDiv.innerText = "Reiniciado.";
    draw();
    // UUIDs oficiales y variantes del protocolo Bosch GLM
const BOSCH_SERVICES = [
  "00005301-0000-0041-4c53-53494e535452", // Servicio de telemetría GLM
  "00000001-0000-1000-8000-00805f9b34fb"  // Variante estándar Bosch
];

btnBLE.addEventListener("click", async () => {
  logDiv.innerText = "Verificando compatibilidad BLE...";

  if (!navigator.bluetooth) {
    logDiv.innerText = "ERROR CRÍTICO: navigator.bluetooth no existe. Abre este enlace en la app Bluefy, no en Safari/Chrome.";
    return;
  }

  try {
    logDiv.innerText = "Buscando dispositivo...";
    
    // Escaneo amplio con captura de todos los servicios conocidos de Bosch
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: BOSCH_SERVICES
    });

    if (!device) {
      logDiv.innerText = "Dispositivo no seleccionado.";
      return;
    }

    logDiv.innerText = `Conectando a: ${device.name || device.id}...`;
    const server = await device.gatt.connect();

    // Detección automática del servicio activo
    let service = null;
    let targetServiceUuid = null;

    for (const uuid of BOSCH_SERVICES) {
      try {
        service = await server.getPrimaryService(uuid);
        if (service) {
          targetServiceUuid = uuid;
          break;
        }
      } catch (e) {
        // Continuar buscando el siguiente UUID
      }
    }

    if (!service) {
      throw new Error("No se encontró el servicio compatible de Bosch en este dispositivo.");
    }

    logDiv.innerText = `Servicio encontrado: ${targetServiceUuid}. Obteniendo características...`;

    // Obtener todas las características del servicio
    const characteristics = await service.getCharacteristics();
    if (!characteristics || characteristics.length === 0) {
      throw new Error("No se encontraron características GATT en el servicio.");
    }

    // Seleccionar la característica de notificación (habitualmente la primera con notify)
    let dataChar = characteristics.find(c => c.properties.notify || c.properties.indicate) || characteristics[0];

    await dataChar.startNotifications();
    dataChar.addEventListener("characteristicvaluechanged", (e) => {
      const val = e.target.value;
      if (val && val.byteLength >= 8) {
        const rawDist = val.getUint32(4, true);
        const meters = rawDist / 1000.0;
        if (meters > 0 && meters < 150) {
          processVector(meters);
        }
      }
    });

    // Envío de inicialización para reporte continuo
    if (dataChar.properties.write || dataChar.properties.writeWithoutResponse) {
      try {
        await dataChar.writeValue(new Uint8Array([0xc0, 0x55, 0x02, 0x01, 0x00, 0x1a]));
      } catch (wErr) {
        console.warn("Write opcional falló:", wErr);
      }
    }

    btnBLE.disabled = true;
    btnBLE.innerText = "GLM Conectado";
    btnDxf.disabled = false;
    logDiv.innerText = "Conexión exitosa. Toma una medición en el GLM.";

  } catch (err) {
    const msg = err && (err.message || err.name) ? (err.message || err.name) : JSON.stringify(err);
    logDiv.innerText = `Error BLE: ${msg}`;
    console.error("BLE Error detallado:", err);
  }
});
  });
</script>
</body>
</html>
