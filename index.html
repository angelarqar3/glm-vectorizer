<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GLM 120 C - Vectorizador</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { background: #111; color: #eee; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { 
      padding: 8px; 
      background: #1c1c1e; 
      display: flex; 
      gap: 6px; 
      flex-wrap: wrap; 
      border-bottom: 1px solid #333; 
    }
    
    button { 
      background: #007aff; 
      color: #fff; 
      border: none; 
      padding: 8px 10px; 
      border-radius: 6px; 
      font-weight: 600; 
      font-size: 0.75rem; 
      cursor: pointer; 
      touch-action: manipulation;
    }
    button.active { background: #34c759; }
    button:disabled { background: #2c2c2e; color: #666; }

    #telemetry { 
      display: flex; 
      justify-content: space-around; 
      background: #000; 
      padding: 6px 4px; 
      font-size: 0.75rem; 
      color: #30d158; 
      border-bottom: 1px solid #222; 
    }

    #canvas-box { 
      flex: 1; 
      position: relative; 
      background: #181818; 
    }
    
    canvas { 
      width: 100%; 
      height: 100%; 
      display: block; 
    }

    #log { 
      height: 160px; 
      overflow-y: auto; 
      background: #080808; 
      padding: 8px; 
      font-size: 0.7rem; 
      border-top: 2px solid #333; 
      color: #aaa;
      line-height: 1.4;
    }
    #log .entry { border-bottom: 1px solid #1a1a1a; padding: 2px 0; word-break: break-all; }
    #log .info { color: #5ac8fa; }
    #log .warn { color: #ffd60a; }
    #log .err  { color: #ff453a; font-weight: bold; }
    #log .ok   { color: #30d158; }
  </style>
</head>
<body>

<header>
  <button id="btnSensors">1. Activar Brújula</button>
  <button id="btnBLE">2. Conectar GLM</button>
  <button id="btnOrtho">ORTO: OFF</button>
  <button id="btnDxf" disabled>Exportar DXF</button>
  <button id="btnClear">Reset</button>
</header>

<div id="telemetry">
  <span>Rumbo: <b id="lblHeading">--</b>°</span>
  <span>Snap: <b id="lblSnapped">--</b>°</span>
  <span>Dist: <b id="lblDist">0.000</b> m</span>
  <span>Pts: <b id="lblPts">1</b></span>
</div>

<div id="canvas-box">
  <canvas id="stage"></canvas>
</div>

<div id="log"></div>

<script>
  // UUIDs reales del GLM 120 C detectados por el escáner
  const TARGET_SERVICES = [
    "02a6c0d0-0451-4000-b000-fb3210111989",
    "02a6c0f0-0451-4000-b000-fb3210111989"
  ];

  let currentHeading = 0;
  let orthoEnabled = false;
  let points = [{ x: 0, y: 0 }];

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const logDiv = document.getElementById("log");
  const lblHeading = document.getElementById("lblHeading");
  const lblSnapped = document.getElementById("lblSnapped");
  const lblDist = document.getElementById("lblDist");
  const lblPts = document.getElementById("lblPts");

  const btnSensors = document.getElementById("btnSensors");
  const btnBLE = document.getElementById("btnBLE");
  const btnOrtho = document.getElementById("btnOrtho");
  const btnDxf = document.getElementById("btnDxf");
  const btnClear = document.getElementById("btnClear");

  function log(msg, type = "info") {
    const d = document.createElement("div");
    d.className = `entry ${type}`;
    const time = new Date().toLocaleTimeString().split(" ")[0];
    d.textContent = `[${time}] ${msg}`;
    logDiv.appendChild(d);
    logDiv.scrollTop = logDiv.scrollHeight;
  }

  function resize() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
    draw();
  }
  window.addEventListener("resize", resize);
  resize();

  // 1. Sensores de Orientación
  btnSensors.addEventListener("click", async () => {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      try {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res === "granted") {
          window.addEventListener("deviceorientation", handleOrientation, true);
          btnSensors.disabled = true;
          btnSensors.innerText = "Brújula OK";
          log("Sensores de orientación activados.", "ok");
        } else {
          log("Permiso de brújula denegado.", "err");
        }
      } catch (e) {
        log("Error brújula: " + (e.message || e), "err");
      }
    } else {
      window.addEventListener("deviceorientation", handleOrientation, true);
      btnSensors.disabled = true;
      btnSensors.innerText = "Brújula OK";
      log("Brújula enlazada directamente.", "ok");
    }
  });

  function handleOrientation(e) {
    if (e.webkitCompassHeading !== undefined) {
      currentHeading = e.webkitCompassHeading;
    } else if (e.alpha !== null) {
      currentHeading = (360 - e.alpha) % 360;
    }

    let eff = currentHeading;
    if (orthoEnabled) {
      eff = Math.round(eff / 90) * 90 % 360;
    }

    lblHeading.innerText = currentHeading.toFixed(1);
    lblSnapped.innerText = eff.toFixed(0);
  }

  btnOrtho.addEventListener("click", () => {
    orthoEnabled = !orthoEnabled;
    btnOrtho.innerText = `ORTO: ${orthoEnabled ? "ON" : "OFF"}`;
    btnOrtho.classList.toggle("active", orthoEnabled);
    log(`Modo Ortogonal: ${orthoEnabled ? "ON" : "OFF"}`);
  });

  // 2. Conexión BLE directa a los servicios identificados
  btnBLE.addEventListener("click", async () => {
    if (!navigator.bluetooth) {
      log("navigator.bluetooth NO disponible en este navegador.", "err");
      return;
    }

    try {
      log("Iniciando escaneo BLE...", "info");

      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: TARGET_SERVICES
      });

      log(`Dispositivo seleccionado: ${device.name || device.id}`, "ok");

      device.addEventListener("gattserverdisconnected", () => {
        log("Dispositivo desconectado.", "warn");
        btnBLE.disabled = false;
        btnBLE.innerText = "2. Conectar GLM";
        btnBLE.classList.remove("active");
      });

      log("Conectando a GATT Server...", "info");
      const server = await device.gatt.connect();
      log("GATT Server conectado.", "ok");

      let notifyChar = null;

      // Iterar por los dos servicios específicos encontrados
      for (const serviceUuid of TARGET_SERVICES) {
        try {
          log(`Accediendo a servicio: ${serviceUuid}...`, "info");
          const service = await server.getPrimaryService(serviceUuid);
          const chars = await service.getCharacteristics();

          for (const c of chars) {
            const p = c.properties;
            log(`Char: ${c.uuid} | read:${p.read} write:${p.write || p.writeWithoutResponse} notify:${p.notify} indicate:${p.indicate}`, "info");
            if ((p.notify || p.indicate) && !notifyChar) {
              notifyChar = c;
            }
          }

          if (notifyChar) break;
        } catch (sErr) {
          log(`Servicio ${serviceUuid} no accesible: ${sErr.message || sErr}`, "warn");
        }
      }

      if (!notifyChar) {
        throw new Error("No se halló característica con soporte de notificación en los servicios objetivo.");
      }

      log(`Suscribiendo a notificaciones en: ${notifyChar.uuid}...`, "info");
      await notifyChar.startNotifications();

      notifyChar.addEventListener("characteristicvaluechanged", (e) => {
        const val = e.target.value;
        const hex = Array.from(new Uint8Array(val.buffer)).map(b => b.toString(16).padStart(2, '0')).join(' ');
        log(`RX (${val.byteLength}b): ${hex}`, "info");

        // Decodificación de distancia: entero de 32 bits little-endian
        if (val.byteLength >= 4) {
          let rawDist = 0;
          if (val.byteLength >= 8) {
            rawDist = val.getUint32(4, true);
          } else {
            rawDist = val.getUint32(0, true);
          }

          const meters = rawDist / 1000.0;
          if (meters > 0.05 && meters < 150) {
            processVector(meters);
          }
        }
      });

      // Secuencia de inicialización / keep-alive opcional si la característica permite escritura
      if (notifyChar.properties.write || notifyChar.properties.writeWithoutResponse) {
        try {
          await notifyChar.writeValue(new Uint8Array([0xc0, 0x55, 0x02, 0x01, 0x00, 0x1a]));
          log("Sincronización enviada.", "ok");
        } catch (wErr) {
          // No bloqueante
        }
      }

      btnBLE.disabled = true;
      btnBLE.innerText = "GLM Conectado";
      btnBLE.classList.add("active");
      btnDxf.disabled = false;
      log("Conectado con éxito. Toma mediciones desde el botón del GLM.", "ok");

    } catch (err) {
      log(`Falla de conexión: ${err.message || err}`, "err");
    }
  });

  function processVector(distance) {
    lblDist.innerText = distance.toFixed(3);

    let angleDeg = currentHeading;
    if (orthoEnabled) {
      angleDeg = Math.round(angleDeg / 90) * 90 % 360;
    }

    const cartesianRad = (90 - angleDeg) * (Math.PI / 180);
    const dx = distance * Math.cos(cartesianRad);
    const dy = distance * Math.sin(cartesianRad);

    const last = points[points.length - 1];
    const next = { x: last.x + dx, y: last.y + dy };
    points.push(next);

    lblPts.innerText = points.length;
    log(`Punto #${points.length}: ${distance.toFixed(3)}m @ ${angleDeg.toFixed(0)}° -> (${next.x.toFixed(2)}, ${next.y.toFixed(2)})`, "ok");
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (points.length < 2) return;

    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    points.forEach(p => {
      minX = Math.min(minX, p.x);
      maxX = Math.max(maxX, p.x);
      minY = Math.min(minY, p.y);
      maxY = Math.max(maxY, p.y);
    });

    const spanX = Math.max(maxX - minX, 0.5);
    const spanY = Math.max(maxY - minY, 0.5);
    const pad = 35;

    const scale = Math.min(
      (canvas.width - pad * 2) / spanX,
      (canvas.height - pad * 2) / spanY
    );

    const toScreen = (p) => ({
      x: pad + (p.x - minX) * scale,
      y: canvas.height - (pad + (p.y - minY) * scale)
    });

    ctx.beginPath();
    ctx.strokeStyle = "#30d158";
    ctx.lineWidth = 2.5;
    const p0 = toScreen(points[0]);
    ctx.moveTo(p0.x, p0.y);

    for (let i = 1; i < points.length; i++) {
      const pi = toScreen(points[i]);
      ctx.lineTo(pi.x, pi.y);
    }
    ctx.stroke();

    points.forEach((p, idx) => {
      const pi = toScreen(p);
      ctx.fillStyle = idx === points.length - 1 ? "#ff453a" : "#ffffff";
      ctx.beginPath();
      ctx.arc(pi.x, pi.y, 4, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  btnDxf.addEventListener("click", () => {
    if (points.length < 2) return;

    let dxf = "0\nSECTION\n2\nENTITIES\n";
    for (let i = 0; i < points.length - 1; i++) {
      const a = points[i];
      const b = points[i + 1];
      dxf += "0\nLINE\n8\nLEVANTAMIENTO\n";
      dxf += `10\n${a.x.toFixed(4)}\n20\n${a.y.toFixed(4)}\n30\n0.0\n`;
      dxf += `11\n${b.x.toFixed(4)}\n21\n${b.y.toFixed(4)}\n31\n0.0\n`;
    }
    dxf += "0\nENDSEC\n0\nEOF\n";

    const blob = new Blob([dxf], { type: "application/dxf" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `levantamiento_${Date.now()}.dxf`;
    link.click();
    URL.revokeObjectURL(url);
    log("DXF generado y descargado.", "ok");
  });

  btnClear.addEventListener("click", () => {
    points = [{ x: 0, y: 0 }];
    lblPts.innerText = "1";
    lblDist.innerText = "0.000";
    log("Trazado reiniciado.");
    draw();
  });
</script>
</body>
</html>
